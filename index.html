<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1a1a1a; --muted: #767a82;
    --bubble-other: #ffffff; --bubble-me: #4f7cff; --bubble-me-text: #ffffff; --border: #e4e6ea;
    --danger: #e0393e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#16171a; --panel:#202226; --text:#f0f0f2; --muted:#9a9ea6;
      --bubble-other:#2b2d33; --bubble-me:#4f7cff; --bubble-me-text:#fff; --border:#33353b;
    }
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; }
  header { padding: max(14px, env(safe-area-inset-top,0px)) 16px 14px; background:var(--panel);
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#34c759; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { font-size:12px; color:var(--muted); margin-left:auto; display:flex; align-items:center; gap:8px; }
  #signOutBtn { border:none; background:transparent; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  #feed { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px;
    scroll-behavior: smooth; }
  .row { display:flex; gap:8px; max-width:80%; align-items:flex-end; }
  .row.enter { animation: rowIn .22s ease-out; }
  @keyframes rowIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .row.other { align-self:flex-start; }
  .avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center; }
  .bubble-wrap { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .name { font-size:11px; color:var(--muted); padding:0 2px; }
  .row.me .name { text-align:right; }
  .bubble { padding:9px 13px; border-radius:16px; font-size:14.5px; line-height:1.35;
    word-wrap:break-word; white-space:pre-wrap; }
  .bubble.has-img { padding:4px; }
  .bubble.has-img img { display:block; max-width:220px; max-height:280px; width:100%;
    border-radius:12px; object-fit:cover; }
  .bubble.has-img .caption { padding:6px 8px 3px; }
  .row.other .bubble { background:var(--bubble-other); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .row.me .bubble { background:var(--bubble-me); color:var(--bubble-me-text); border-bottom-right-radius:4px; }
  .empty { margin:auto; text-align:center; color:var(--muted); font-size:14px; padding:20px; }
  form#composer { display:flex; gap:8px; padding:10px 12px;
    padding-bottom:max(10px, env(safe-area-inset-bottom,0px));
    background:var(--panel); border-top:1px solid var(--border); flex-shrink:0;
    flex-wrap:wrap; align-items:center; }
  #attachBtn { border:none; background:var(--bg); color:var(--muted); width:36px; height:36px;
    border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; }
  #attachBtn:disabled { opacity:.5; cursor:default; }
  #imagePreviewRow { display:none; width:100%; align-items:center; gap:8px; padding:0 0 8px; }
  #imagePreviewRow.show { display:flex; }
  #imagePreviewRow img { width:52px; height:52px; object-fit:cover; border-radius:10px; border:1px solid var(--border); }
  #imagePreviewRow .clear { border:none; background:var(--bg); color:var(--muted); width:22px; height:22px;
    border-radius:50%; cursor:pointer; font-size:12px; line-height:1; }
  #imagePreviewRow .note { font-size:12px; color:var(--muted); }
  #input { flex:1; border:1px solid var(--border); border-radius:20px; padding:10px 15px;
    font-size:14.5px; background:var(--bg); color:var(--text); outline:none; min-width:0; }
  #send { border:none; background:var(--bubble-me); color:#fff; border-radius:20px;
    padding:0 18px; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0; }
  #send:disabled { opacity:.5; cursor:default; }
  .voiceBtn, .callBtn { border:none; background:var(--bg); color:var(--text); width:36px; height:36px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .voiceBtn.recording { background:#e53935; color:#fff; animation:pulse 1s infinite; }
  .callBtn:disabled, .voiceBtn:disabled { opacity:.45; cursor:default; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #callOverlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); padding:20px; }
  #callOverlay.show { display:flex; }
  #callCard { width:min(340px,100%); background:var(--panel); border-radius:20px; padding:24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  #callAvatar { width:72px; height:72px; border-radius:50%; margin:0 auto 12px; background-size:cover; background-position:center; }
  #callTitle { font-size:18px; font-weight:700; margin-bottom:5px; }
  #callStatus { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .callActions { display:flex; justify-content:center; gap:14px; }
  .callActions button { border:none; border-radius:50%; width:50px; height:50px; font-size:20px; cursor:pointer; }
  #acceptCallBtn { background:#34c759; color:#fff; }
  #declineCallBtn, #hangupCallBtn { background:#e53935; color:#fff; }
  #speakerCallBtn { background:#555; color:#fff; display:none; }
  #speakerCallBtn.on { background:#007aff; }
  #speakerCallBtn:disabled { opacity:.5; }
  #banner { padding:10px 16px; font-size:13px; color:var(--muted); text-align:center; }

  #authOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex;
    align-items:center; justify-content:center; z-index:10; padding:20px; }
  #authCard { background:var(--panel); border-radius:14px; padding:22px; width:100%; max-width:340px; }
  #authCard h2 { margin:0 0 4px; font-size:16px; }
  #authCard p.sub { margin:0 0 16px; font-size:13px; color:var(--muted); }
  .tabs { display:flex; gap:4px; background:var(--bg); border-radius:10px; padding:3px; margin-bottom:16px; }
  .tabs button { flex:1; border:none; background:transparent; padding:8px; border-radius:8px;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button.active { background:var(--panel); color:var(--text); }
  #authCard input { width:100%; padding:10px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px; margin-bottom:10px; }
  #authCard button.primary { width:100%; border:none; background:var(--bubble-me); color:#fff;
    padding:10px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
  #authError { color:var(--danger); font-size:12px; margin:-4px 0 8px; min-height:14px; }
  #authNote { font-size:12px; color:var(--muted); margin-top:10px; }

  .menuBtn { border:none; background:var(--bg); color:var(--text); width:30px; height:30px;
    border-radius:50%; font-size:14px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }

  .media-wrap { position:relative; }
  .media-wrap img, .media-wrap video { cursor:zoom-in; }
  .media-wrap video { max-width:220px; max-height:280px; width:100%; border-radius:12px;
    display:block; background:#000; }
  .dl-btn { position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.55); color:#fff; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
  .media-wrap:hover .dl-btn, .media-wrap:active .dl-btn { opacity:1; }
  @media (hover:none) { .dl-btn { opacity:1; } }

  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:20; display:none;
    align-items:center; justify-content:center; padding:20px;
    padding-top:max(20px, env(safe-area-inset-top,0px));
    padding-bottom:max(20px, env(safe-area-inset-bottom,0px)); }
  #lightbox.show { display:flex; }
  #lightbox img, #lightbox video { max-width:100%; max-height:100%; border-radius:8px; }
  #lightbox .lbControls { position:absolute; top:max(16px, env(safe-area-inset-top,0px)); right:16px;
    display:flex; gap:10px; }
  #lightbox .lbControls button { border:none; background:rgba(255,255,255,0.15); color:#fff;
    width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }

  #contactsOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:15; display:none; }
  #contactsOverlay.show { display:block; }
  #contactsPanel { position:absolute; top:0; left:0; height:100%; width:min(80%, 300px);
    background:var(--panel); display:flex; flex-direction:column; transform:translateX(-100%);
    transition:transform .2s ease-out; padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px); }
  #contactsOverlay.show #contactsPanel { transform:translateX(0); }
  .panel-header { display:flex; align-items:center; justify-content:space-between; padding:16px;
    border-bottom:1px solid var(--border); font-weight:600; font-size:15px; flex-shrink:0; }
  .panel-header button { border:none; background:var(--bg); color:var(--muted); width:28px; height:28px;
    border-radius:50%; cursor:pointer; font-size:13px; }
  #contactSearch { margin:10px 12px; padding:10px 13px; border:1px solid var(--border); border-radius:20px;
    background:var(--bg); color:var(--text); font-size:14px; outline:none; width:calc(100% - 24px); flex-shrink:0; }
  #contactsList { flex:1; overflow-y:auto; }
  .contact-item .cinfo { min-width:0; display:flex; flex-direction:column; }
  .contact-item .cemail { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contact-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; }
  .contact-item:active, .contact-item.active { background:var(--bg); }
  .contact-item .avatar { width:32px; height:32px; }
  .contact-item .cname { font-size:14px; }
  .contact-item { position:relative; }
  .unread-badge { margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:#e53935; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .menuBtn { position:relative; }
  .menu-unread-badge { position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:9px; background:#e53935; color:#fff; font-size:10px; font-weight:700; display:none; align-items:center; justify-content:center; border:2px solid var(--panel); }
  .contact-empty { padding:16px; font-size:13px; color:var(--muted); }
  .contact-item .cinfo { flex:1; }
  .contact-item .cmeta { display:flex; align-items:center; gap:7px; margin-top:2px; }
  .contact-item .follow-count { font-size:10.5px; color:var(--muted); }
  .contact-item .presence-label { font-size:10.5px; color:var(--muted); }
  .contact-item .presence-label.online { color:#34c759; }
  .follow-btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:14px; padding:5px 9px; font-size:11px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .follow-btn.following { background:var(--bg); color:var(--muted); }
  .follow-btn:disabled { opacity:.5; cursor:default; }

  .date-sep { text-align:center; font-size:11px; color:var(--muted); margin:6px 0 2px; }
  .date-sep span { background:var(--bg); padding:2px 10px; border-radius:10px; }

  .quote-block { margin:0 0 5px; padding:6px 9px; border-left:3px solid var(--bubble-me);
    background:rgba(0,0,0,0.05); border-radius:6px; font-size:12.5px; cursor:pointer; }
  .row.me .quote-block { border-left-color:rgba(255,255,255,0.7); background:rgba(255,255,255,0.15); }
  .quote-block .qname { font-weight:600; font-size:11.5px; margin-bottom:1px; }
  .quote-block .qtext { opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:block; max-width:220px; }

  .bubble.deleted { font-style:italic; color:var(--muted) !important; background:transparent !important;
    border:1px dashed var(--border) !important; }
  .edited-tag { font-size:10.5px; opacity:.65; margin-left:5px; }

  .reactions-bar { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .reaction-pill { border:1px solid var(--border); background:var(--panel); border-radius:12px;
    padding:1px 7px; font-size:12px; cursor:pointer; }
  .reaction-pill.mine { border-color:var(--bubble-me); background:rgba(79,124,255,0.12); }

  .msg-meta-row { display:flex; align-items:center; gap:2px; }
  .row.me .msg-meta-row { justify-content:flex-end; }
  .msg-ticks { font-size:11px; color:var(--muted); }
  .msg-ticks.read { color:#4f9eff; }
  .msg-time { font-size:10px; color:var(--muted); opacity:.75; }

  #typingIndicator { padding:2px 16px 6px; font-size:12px; color:var(--muted); font-style:italic; min-height:0; }

  #scrollLatestBtn { position:fixed; right:16px; bottom:78px; z-index:12; width:38px; height:38px;
    border-radius:50%; border:none; background:var(--panel); color:var(--text);
    box-shadow:0 4px 16px rgba(0,0,0,0.25); font-size:16px; cursor:pointer; display:none;
    align-items:center; justify-content:center; }
  #scrollLatestBtn.show { display:flex; }

  .sub-status { font-size:11px; color:var(--muted); margin-top:1px; }
  .sub-status.online { color:#34c759; }

  #replyPreviewRow { display:none; width:100%; align-items:center; gap:8px; padding:0 0 8px; }
  #replyPreviewRow.show { display:flex; }
  #replyPreviewRow .rp-bar { width:3px; align-self:stretch; background:var(--bubble-me); border-radius:2px; flex-shrink:0; }
  #replyPreviewRow .rp-body { flex:1; min-width:0; }
  #replyPreviewRow .rp-name { font-size:12px; font-weight:600; }
  #replyPreviewRow .rp-text { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #replyPreviewRow .rp-close { border:none; background:var(--bg); color:var(--muted); width:22px; height:22px;
    border-radius:50%; cursor:pointer; font-size:12px; flex-shrink:0; }

  .msg-menu-overlay { position:fixed; inset:0; z-index:39; display:none; }
  .msg-menu-overlay.show { display:block; }
  .msg-menu { position:fixed; z-index:40; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 12px 32px rgba(0,0,0,0.3); overflow:hidden; min-width:180px; display:none; }
  .msg-menu.show { display:block; }
  .msg-menu .emoji-row { display:flex; padding:8px; gap:4px; border-bottom:1px solid var(--border); }
  .msg-menu .emoji-row button { border:none; background:transparent; font-size:20px; cursor:pointer; padding:4px; border-radius:8px; }
  .msg-menu .emoji-row button:active { background:var(--bg); }
  .msg-menu .menu-item { display:block; width:100%; text-align:left; border:none; background:transparent;
    color:var(--text); padding:11px 14px; font-size:14px; cursor:pointer; }
  .msg-menu .menu-item:active { background:var(--bg); }
  .msg-menu .menu-item.danger { color:var(--danger); }

  .edit-box { display:flex; flex-direction:column; gap:6px; min-width:180px; }
  .edit-box textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:6px 9px;
    font-size:14px; font-family:inherit; background:var(--bg); color:var(--text); resize:none; }
  .edit-box .edit-actions { display:flex; gap:8px; justify-content:flex-end; }
  .edit-box .edit-actions button { border:none; border-radius:14px; padding:4px 12px; font-size:12px; cursor:pointer; }
  .edit-box .save-btn { background:var(--bubble-me); color:#fff; }
  .edit-box .cancel-btn { background:var(--bg); color:var(--text); }
</style>
</head>
<body>

<div id="authOverlay">
  <div id="authCard">
    <div class="tabs">
      <button id="tabSignIn" class="active" type="button">Sign in</button>
      <button id="tabSignUp" type="button">Create account</button>
    </div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Sign in to join the chat.</p>
    <div id="nameField" style="display:none">
      <input id="displayName" placeholder="Display name" maxlength="24" />
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="authError"></div>
    <button id="authSubmit" class="primary" type="button">Sign in</button>
    <div id="authNote"></div>
  </div>
</div>

<header>
  <button class="menuBtn" id="menuBtn" type="button" title="Chats">☰<span id="menuUnreadBadge" class="menu-unread-badge"></span></button>
  <div class="dot"></div>
  <div style="min-width:0;">
    <h1 id="chatTitle">Group Chat</h1>
    <div id="chatSubtitle" class="sub-status"></div>
  </div>
  <div class="sub"><span id="who"></span><button id="signOutBtn" style="display:none">Sign out</button></div>
</header>

<div id="contactsOverlay">
  <div id="contactsPanel">
    <div class="panel-header">
      <span>Chats</span>
      <button id="closeContacts" type="button">✕</button>
    </div>
    <input id="contactSearch" type="search" placeholder="Search name or email…" autocomplete="off" />
    <div id="contactsList"><div class="contact-empty">Loading…</div></div>
  </div>
</div>

<div id="feed"><div class="empty">Loading…</div></div>
<button id="scrollLatestBtn" type="button" title="Jump to latest">↓</button>
<div id="typingIndicator" style="display:none"></div>
<div id="banner" style="display:none"></div>
<form id="composer">
  <div id="replyPreviewRow">
    <div class="rp-bar"></div>
    <div class="rp-body">
      <div class="rp-name" id="replyPreviewName"></div>
      <div class="rp-text" id="replyPreviewText"></div>
    </div>
    <button type="button" class="rp-close" id="replyPreviewClose">✕</button>
  </div>
  <div id="imagePreviewRow">
    <img id="imagePreviewThumb" alt="" />
    <video id="videoPreviewThumb" muted playsinline style="display:none"></video>
    <span class="note" id="imagePreviewNote">Image attached</span>
    <button type="button" class="clear" id="clearImageBtn">✕</button>
  </div>
  <button id="attachBtn" type="button" title="Attach photo or video">📎</button>
  <button id="voiceBtn" class="voiceBtn" type="button" title="Record voice message">🎙️</button>
  <button id="callBtn" class="callBtn" type="button" title="Voice call">📞</button>
  <input id="fileInput" type="file" accept="image/*,video/*" style="display:none" />
  <input id="input" placeholder="Message…" autocomplete="off" maxlength="2000" />
  <button id="send" type="submit">Send</button>
</form>

<div id="callOverlay">
  <div id="callCard">
    <div id="callAvatar"></div>
    <div id="callTitle">Incoming call</div>
    <div id="callStatus">Voice call</div>
    <div id="callTimer" style="display:none;font-size:24px;font-weight:700;margin-top:8px;">00:00</div>
    <div class="callActions">
      <button id="acceptCallBtn" type="button" title="Accept">📞</button>
      <button id="declineCallBtn" type="button" title="Decline">✕</button>
      <button id="hangupCallBtn" type="button" title="Hang up" style="display:none">📵</button>
      <button id="speakerCallBtn" type="button" title="Speaker" style="display:none">🔊</button>
    </div>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<div id="lightbox">
  <div class="lbControls">
    <button id="lbDownload" type="button" title="Download">⬇</button>
    <button id="lbClose" type="button" title="Close">✕</button>
  </div>
  <div id="lbContent"></div>
</div>

<div id="msgMenuOverlay" class="msg-menu-overlay"></div>
<div id="msgMenu" class="msg-menu">
  <div class="emoji-row" id="msgMenuEmojiRow"></div>
  <button class="menu-item" type="button" data-action="reply">↩️ Reply</button>
  <button class="menu-item" type="button" data-action="copy">📋 Copy</button>
  <button class="menu-item" type="button" data-action="edit">✏️ Edit</button>
  <button class="menu-item danger" type="button" data-action="delete">🗑️ Delete</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://wwcmntdvuecbuydhqsqo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_nFxiub_VpITzHtdiiTaAWw_sa9-qVif";

  const feed = document.getElementById('feed');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const whoEl = document.getElementById('who');
  const signOutBtn = document.getElementById('signOutBtn');
  const banner = document.getElementById('banner');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewRow = document.getElementById('imagePreviewRow');
  const imagePreviewThumb = document.getElementById('imagePreviewThumb');

  function initialsAvatar(name) {
    const letter = (name || '?').trim().charAt(0).toUpperCase() || '?';
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><rect width="26" height="26" rx="13" fill="hsl(${hue},55%,50%)"/><text x="13" y="18" font-size="12" text-anchor="middle" fill="#fff" font-family="sans-serif">${letter}</text></svg>`

  function fmtRelativeTime(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  async function loadUnreadCounts() {
    if (!myId) return;
    const { data, error } = await client.from('messages')
      .select('uid, created_at')
      .eq('recipient_id', myId)
      .order('created_at', { ascending: true })
      .limit(1000);
    if (error || !data) return;
    for (const key of Object.keys(unreadCounts)) delete unreadCounts[key];
    for (const m of data) {
      const readAt = getReadAt(m.uid);
      if (!readAt || (m.created_at && m.created_at > readAt)) {
        unreadCounts[m.uid] = (unreadCounts[m.uid] || 0) + 1;
      }
    }
    updateMenuUnreadBadge();
    renderContacts();
  }

  // --- Private chats: contacts are read from a "profiles" table (id + username per user). ---
  async function ensureProfile() {
    if (!myId) return;
    try {
      const { data: userData } = await client.auth.getUser();
      const email = userData?.user?.email || '';
      await client.from('profiles').upsert(
        { id: myId, username: myName, email },
        { onConflict: 'id' }
      );
    } catch (e) { /* profiles table may not be set up yet; contacts list will explain */ }
  }

  async function loadFollowData() {
    if (!myId) return;
    const ids = contacts.map(c => c.id).filter(Boolean);
    followStateByUser.clear();
    if (!ids.length) return;
    const { data, error } = await client.from('follows')
      .select('follower_id, followed_id')
      .or(`follower_id.eq.${myId},followed_id.in.(${ids.join(',')})`);
    if (error || !data) return;
    const counts = new Map();
    for (const row of data) {
      if (ids.includes(row.followed_id)) counts.set(row.followed_id, (counts.get(row.followed_id) || 0) + 1);
      if (row.follower_id === myId && ids.includes(row.followed_id)) {
        const cur = followStateByUser.get(row.followed_id) || {};
        cur.following = true;
        followStateByUser.set(row.followed_id, cur);
      }
    }
    for (const c of contacts) {
      const state = followStateByUser.get(c.id) || {};
      state.followers = Number(c.followers_count || 0);
      // The query above only gives a reliable count for rows visible under RLS; prefer the profile counter.
      followStateByUser.set(c.id, state);
    }
  }

  async function toggleFollow(userId, btn) {
    if (!myId || !userId || userId === myId || followLoading) return;
    followLoading = true;
    btn.disabled = true;
    const state = followStateByUser.get(userId) || { following:false, followers:0 };
    try {
      if (state.following) {
        const { error } = await client.from('follows').delete()
          .eq('follower_id', myId).eq('followed_id', userId);
        if (error) throw error;
        state.following = false;
        state.followers = Math.max(0, Number(state.followers || 0) - 1);
      } else {
        const { error } = await client.from('follows').insert({ follower_id: myId, followed_id: userId });
        if (error) throw error;
        state.following = true;
        state.followers = Number(state.followers || 0) + 1;
      }
      followStateByUser.set(userId, state);
      renderContacts();
    } catch (e) {
      showBanner('Could not update follow: ' + (e.message || 'unknown error'));
      btn.disabled = false;
    } finally {
      followLoading = false;
    }
  }

      contacts = [];

      showBanner('Private chats need a "profiles" table in Supabase — see setup notes.');

    contacts = data || [];
    await loadFollowData();
    await loadUnreadCounts();
    renderContacts();
  }

  async function downloadMedia(url, type) {
    if (!url) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const ext = (url.split('.').pop() || '').split('?')[0];
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = `${type || 'file'}_${Date.now()}${ext ? '.' + ext : ''}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objUrl);
    } catch (err) {
      showBanner('Could not download: ' + (err.message || 'unknown error'));
    }
  }

      return;

    const limitMb = isImage ? MAX_IMAGE_MB : MAX_VIDEO_MB;
    if (file.size > limitMb * 1024 * 1024) {

    setPendingMedia(file, isImage ? 'image' : 'video');

  function insertDateSeparatorIfNeeded(dateSource) {
    if (skipDateSeparator) return;
    const d = dateSource ? new Date(dateSource) : new Date();
    const key = d.toDateString();
    if (key === lastDateKey) return;
    lastDateKey = key;
    const today = new Date().toDateString();
    const yest = new Date(Date.now() - 86400000).toDateString();
    let label = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    if (key === today) label = 'Today';
    else if (key === yest) label = 'Yesterday';
    const sep = document.createElement('div');
    sep.className = 'date-sep';
    sep.innerHTML = '<span></span>';
    sep.querySelector('span').textContent = label;
    feed.appendChild(sep);
  }

  function renderReactionsBar(row, messageId) {
    if (!row) return;
    let bar = row.querySelector('.reactions-bar');
    const counts = reactionsByMessage.get(messageId);
    if (!counts || counts.size === 0) {
      if (bar) bar.remove();
      return;
    }
    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'reactions-bar';
      row.querySelector('.bubble-wrap').appendChild(bar);
    }
    bar.innerHTML = '';
    for (const [emoji, userSet] of counts) {
      if (userSet.size === 0) continue;
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'reaction-pill' + (userSet.has(myId) ? ' mine' : '');
      pill.textContent = emoji + ' ' + userSet.size;
      pill.addEventListener('click', () => toggleReaction(messageId, emoji));
      bar.appendChild(pill);
    }
    if (!bar.children.length) bar.remove();
  }

  function addRow(m, scroll) {
    if (feed.querySelector('.empty')) feed.innerHTML = '';
    insertDateSeparatorIfNeeded(m.created_at);

    const isMe = m.uid === myId;
    const row = document.createElement('div');
    row.className = 'row ' + (isMe ? 'me' : 'other') + (scroll !== false ? ' enter' : '');
    if (m._tempId) row.dataset.tempId = m._tempId;
    if (m.id != null) row.dataset.id = String(m.id);

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.backgroundImage = `url("${initialsAvatar(m.username || '?')}")`;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    if (!isMe) {
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = m.username || 'Someone';
      wrap.appendChild(nameEl);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (m.deleted_at) {
      bubble.classList.add('deleted');
      bubble.textContent = 'This message was deleted';
      wrap.appendChild(bubble);
    } else {
      if (m.reply_to_id) {
        const quoted = messagesById.get(m.reply_to_id);
        const q = document.createElement('div');
        q.className = 'quote-block';
        q.dataset.quoteId = String(m.reply_to_id);
        const qn = document.createElement('div');
        qn.className = 'qname';
        qn.textContent = quoted ? (quoted.uid === myId ? 'You' : (quoted.username || 'Someone')) : 'Message';
        const qt = document.createElement('span');
        qt.className = 'qtext';
        qt.textContent = quoted ? formatQuotePreview(quoted) : 'Loading…';
        q.appendChild(qn);
        q.appendChild(qt);
        q.addEventListener('click', () => {
          const target = feed.querySelector(`[data-id="${m.reply_to_id}"]`);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.style.transition = 'background-color .3s';
            target.style.backgroundColor = 'rgba(79,124,255,0.18)';
            setTimeout(() => { target.style.backgroundColor = ''; }, 900);
          }
        });
        wrap.appendChild(q);
        if (!quoted) fetchAndPatchQuote(m.reply_to_id);
      }

      if (m.audio_url) {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = m.audio_url;
        audio.style.maxWidth = '240px';
        bubble.appendChild(audio);
        if (m.text) { const cap=document.createElement('div'); cap.className='caption'; cap.textContent=m.text; bubble.appendChild(cap); }
      } else if (m.image_url || m.video_url) {
        bubble.classList.add('has-img');
        const isVideo = !!m.video_url;
        const url = m.video_url || m.image_url;

        const mediaWrap = document.createElement('div');
        mediaWrap.className = 'media-wrap';

        let mediaEl;
        if (isVideo) {
          mediaEl = document.createElement('video');
          mediaEl.src = url;
          mediaEl.muted = true;
          mediaEl.playsInline = true;
          mediaEl.preload = 'metadata';
        } else {
          mediaEl = document.createElement('img');
          mediaEl.src = url;
          mediaEl.alt = 'image';
          mediaEl.loading = 'lazy';
        }
        mediaEl.addEventListener('click', () => openLightbox(url, isVideo ? 'video' : 'image'));

        const dlBtn = document.createElement('button');
        dlBtn.type = 'button';
        dlBtn.className = 'dl-btn';
        dlBtn.title = 'Download';
        dlBtn.textContent = '⬇';
        dlBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          downloadMedia(url, isVideo ? 'video' : 'image');
        });

        mediaWrap.appendChild(mediaEl);
        mediaWrap.appendChild(dlBtn);
        bubble.appendChild(mediaWrap);

        if (m.text) {
          const cap = document.createElement('div');
          cap.className = 'caption';
          cap.textContent = m.text;
          bubble.appendChild(cap);
        }
      } else {
        bubble.textContent = m.text || '';
      }

      if (m.edited_at) {
        const tag = document.createElement('span');
        tag.className = 'edited-tag';
        tag.textContent = '(edited)';
        bubble.appendChild(tag);
      }

      wrap.appendChild(bubble);

      const meta = document.createElement('div');
      meta.className = 'msg-meta-row';
      if (m.created_at) {
        const t = document.createElement('span');
        t.className = 'msg-time';
        t.textContent = new Date(m.created_at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        meta.appendChild(t);
      }
      if (isMe && currentChat.type === 'dm') {
        const ticks = document.createElement('span');
        ticks.className = 'msg-ticks' + (m.read_at ? ' read' : '');
        ticks.textContent = m.read_at ? '✓✓' : '✓';
        meta.appendChild(ticks);
      }
      if (meta.children.length) wrap.appendChild(meta);
    }

    row.appendChild(avatar);
    row.appendChild(wrap);
    feed.appendChild(row);
    if (scroll !== false) feed.scrollTop = feed.scrollHeight;

    if (m.id != null) {
      seenIds.add(m.id);
      messagesById.set(m.id, m);
      renderReactionsBar(row, m.id);
    }
    if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
  }

  async function fetchAndPatchQuote(id) {
    if (messagesById.has(id)) return;
    const { data } = await client.from('messages').select('id, uid, username, text, image_url, video_url, audio_url, deleted_at').eq('id', id).maybeSingle();
    if (!data) return;
    messagesById.set(id, data);
    feed.querySelectorAll(`.quote-block[data-quote-id="${id}"]`).forEach(q => {
      q.querySelector('.qname').textContent = data.uid === myId ? 'You' : (data.username || 'Someone');
      q.querySelector('.qtext').textContent = formatQuotePreview(data);
    });
  }

  function drawIncoming(m) {
    if (!belongsToCurrentChat(m)) return;
    if (m.id != null && seenIds.has(m.id)) return; // already on screen, via realtime or poll
    if (m.uid === myId) {
      const idx = pendingByText.findIndex(p => p.text === m.text && p.hasImage === !!(m.image_url || m.video_url));
      if (idx !== -1) {
        // Already drawn optimistically when we sent it. Link the temp row to the
        // real row so reactions/replies/edit/delete work on it right away.
        const tempId = pendingByText[idx].tempId;
        pendingByText.splice(idx, 1);
        const row = feed.querySelector(`[data-temp-id="${tempId}"]`);
        if (row) {
          row.dataset.id = String(m.id);
          const meta = row.querySelector('.msg-meta-row .msg-time');
          if (meta && m.created_at) meta.textContent = new Date(m.created_at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }
        if (m.id != null) {
          seenIds.add(m.id);
          messagesById.set(m.id, m);
        }
        if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
        return;
      }
    }
    addRow(m, true);
    if (currentChat.type === 'dm' && document.visibilityState === 'visible') markDmReadRpc();
  }

  // Quiet safety net: if the realtime socket ever drops without us noticing (backgrounded tab,
  // flaky mobile network), this catches anything we missed. Cheap, since it only asks for
  // messages newer than the last one we've already drawn.
  async function pollForMissed() {
    if (!myId) return;
    let q = client.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
    q = applyChatFilter(q);
    q = lastSeenAt ? q.gt('created_at', lastSeenAt) : q.limit(200);
    const { data, error } = await q;
    if (!error && data) data.forEach(drawIncoming);
  }

  function handleMessageUpdate(m) {
    const cached = messagesById.get(m.id) || {};
    const merged = { ...cached, ...m };
    messagesById.set(m.id, merged);
    if (!belongsToCurrentChat(merged)) return;
    const row = feed.querySelector(`[data-id="${m.id}"]`);
    if (!row) return;
    const scrollBottom = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 40;
    const idx = Array.from(feed.children).indexOf(row);
    row.remove();
    skipDateSeparator = true;
    addRow(merged, false);
    skipDateSeparator = false;
    const newRow = feed.lastElementChild;
    feed.insertBefore(newRow, feed.children[idx] || null);
    if (scrollBottom) feed.scrollTop = feed.scrollHeight;
  }

  function subscribeReactions() {
    if (reactionsChannel) client.removeChannel(reactionsChannel);
    reactionsChannel = client
      .channel('public:message_reactions:' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: '*', schema: 'public', table: 'message_reactions' }, (payload) => {
        const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
        if (!row) return;
        const mid = row.message_id;
        if (!reactionsByMessage.has(mid)) reactionsByMessage.set(mid, new Map());
        const counts = reactionsByMessage.get(mid);
        if (payload.eventType === 'DELETE') {
          const set = counts.get(row.emoji);
          if (set) { set.delete(row.user_id); if (!set.size) counts.delete(row.emoji); }
        } else {
          if (!counts.has(row.emoji)) counts.set(row.emoji, new Set());
          counts.get(row.emoji).add(row.user_id);
        }
        const domRow = feed.querySelector(`[data-id="${mid}"]`);
        if (domRow) renderReactionsBar(domRow, mid);
      })
      .subscribe();
  }

  async function loadReactionsFor(ids) {
    if (!ids.length) return;
    const { data, error } = await client.from('message_reactions').select('message_id, user_id, emoji').in('message_id', ids);
    if (error || !data) return;
    for (const r of data) {
      if (!reactionsByMessage.has(r.message_id)) reactionsByMessage.set(r.message_id, new Map());
      const counts = reactionsByMessage.get(r.message_id);
      if (!counts.has(r.emoji)) counts.set(r.emoji, new Set());
      counts.get(r.emoji).add(r.user_id);
    }
    for (const id of ids) {
      const domRow = feed.querySelector(`[data-id="${id}"]`);
      if (domRow) renderReactionsBar(domRow, id);
    }
  }

  async function toggleReaction(messageId, emoji) {
    if (!myId || messageId == null) return;

    // One reaction per user per message: tapping another emoji replaces the
    // previous one. Tapping the same emoji again removes the reaction.
    const counts = reactionsByMessage.get(messageId);
    const mine = !!(counts && counts.get(emoji) && counts.get(emoji).has(myId));

    try {
      const { error: delError } = await client.from('message_reactions')
        .delete()
        .eq('message_id', messageId)
        .eq('user_id', myId);
      if (delError) throw delError;

      if (counts) {
        for (const [existingEmoji, userSet] of counts) {
          userSet.delete(myId);
          if (!userSet.size) counts.delete(existingEmoji);
        }
      }

      // Same emoji = remove only. Different emoji = replace with the new one.
      if (!mine) {
        const { error: insertError } = await client.from('message_reactions')
          .insert({ message_id: messageId, user_id: myId, emoji });
        if (insertError) throw insertError;

        if (!reactionsByMessage.has(messageId)) reactionsByMessage.set(messageId, new Map());
        const c = reactionsByMessage.get(messageId);
        if (!c.has(emoji)) c.set(emoji, new Set());
        c.get(emoji).add(myId);
      }

      const domRow = feed.querySelector(`[data-id="${messageId}"]`);
      if (domRow) renderReactionsBar(domRow, messageId);
    } catch (e) {
      showBanner('Could not update reaction: ' + (e.message || 'unknown error'));
    }
  }

  function subscribeRealtime() {
    if (channel) client.removeChannel(channel);
    channel = client
      .channel('public:messages:' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        drawIncoming(payload.new);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (payload) => {
        handleMessageUpdate(payload.new);
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          // Reconnect shortly, and immediately poll so nothing sent during the gap is missed.
          setTimeout(() => { if (myId) subscribeRealtime(); }, 2000);
          pollForMissed();
        }
      });
    subscribeReactions();
  }

  async function loadAndSubscribe() {
    let q = client
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(200);

    q = applyChatFilter(q);

    const { data, error } = await q;

    if (error) {
      showBanner('Could not load messages: ' + error.message);
      feed.innerHTML = '<div class="empty">Couldn\'t load chat. See message below.</div>';
    } else {
      renderAll(data || []);
      loadReactionsFor((data || []).map(m => m.id));
    }

    subscribeRealtime();

    if (!pollTimer) {
      pollTimer = setInterval(pollForMissed, 8000); // background safety net, not the main path
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && myId) {
        pollForMissed();
        if (currentChat.type === 'dm') markDmReadRpc();
      }
    });
  }

  // Messages we've drawn locally before the server confirms them, keyed by a client-generated id.
  // When the realtime INSERT event for our own message arrives, we match it here instead of
  // drawing it a second time.
  const pendingByText = []; // FIFO of { tempId, text, hasImage }

  async function sendVoiceBlob(blob) {
    if (!myId || currentChat.type !== 'dm') { showBanner('Open a private chat to send a voice message.'); return; }
    const localUrl = URL.createObjectURL(blob);
    const tempId = makeClientId();
    const text = '';
    pendingByText.push({ tempId, text, hasImage: true });
    addRow({ uid: myId, username: myName, text: '', audio_url: localUrl, _tempId: tempId }, true);
    try {
      const path = `${myId}/voice_${Date.now()}_${Math.random().toString(36).slice(2,8)}.webm`;
      const { error: upErr } = await client.storage.from('chat-images').upload(path, blob, { contentType: blob.type || 'audio/webm', cacheControl:'3600', upsert:false });
      if (upErr) throw upErr;
      const audio_url = client.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
      const { error: insErr } = await client.from('messages').insert({ uid:myId, username:myName, text:'', image_url:null, video_url:null, audio_url, recipient_id:currentChat.id });
      if (insErr) throw insErr;
      URL.revokeObjectURL(localUrl);
    } catch (err) {
      showBanner('Could not send voice message: ' + (err.message || 'unknown error'));
      const el = feed.querySelector(`[data-temp-id="${tempId}"]`); if (el) el.remove();
      const idx=pendingByText.findIndex(p=>p.tempId===tempId); if(idx!==-1) pendingByText.splice(idx,1);
      URL.revokeObjectURL(localUrl);
    }
  }

  voiceBtn.addEventListener('click', async () => {
    if (currentChat.type !== 'dm') { showBanner('Open a private chat first.'); return; }
    if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      voiceChunks=[];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size) voiceChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t=>t.stop());
        voiceBtn.classList.remove('recording'); voiceBtn.textContent='🎙️';
        const blob = new Blob(voiceChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        if (blob.size) await sendVoiceBlob(blob);
        mediaRecorder=null; voiceChunks=[];
      };
      mediaRecorder.start();
      voiceBtn.classList.add('recording'); voiceBtn.textContent='⏹️';
    } catch (err) { showBanner('Microphone permission is needed for voice messages.'); }
  });

  function updateCallButtons() {
    const enabled = currentChat.type === 'dm' && !!myId;
    callBtn.disabled = !enabled || !!peerConnection;
    voiceBtn.disabled = !enabled;
  }

  function startCallTimer(startedAt) {
    callStartedAt = Number(startedAt) || Date.now();
    callTimer.style.display = 'block';
    const tick = () => {
      const seconds = Math.max(0, Math.floor((Date.now() - callStartedAt) / 1000));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const sec = seconds % 60;
      callTimer.textContent = h
        ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };
    clearInterval(callTimerInterval);
    tick();
    callTimerInterval = setInterval(tick, 1000);
  }

  function stopCallTimer() {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    callStartedAt = null;
    callTimer.style.display = 'none';
    callTimer.textContent = '00:00';
  }

  function showCallUI(name, status, incoming=false) {
    callAvatar.style.backgroundImage=`url("${initialsAvatar(name || '?')}")`;
    callTitle.textContent = name || 'Voice call';
    callStatus.textContent = status;
    acceptCallBtn.style.display = incoming ? 'block' : 'none';
    declineCallBtn.style.display = incoming ? 'block' : 'none';
    hangupCallBtn.style.display = incoming ? 'none' : 'block';
    speakerCallBtn.style.display = incoming ? 'none' : 'block';
    callOverlay.classList.add('show');
  }

  function hideCallUI(){
    // Hide immediately. Do not wait for WebRTC or Supabase cleanup.
    callOverlay.classList.remove('show');
    callOverlay.style.display = 'none';
    stopCallTimer();
    speakerOn=false;
    speakerCallBtn.classList.remove('on');
    speakerCallBtn.textContent='🔊';
    speakerCallBtn.title='Speaker';
    declineCallBtn.style.display='block';
    hangupCallBtn.style.display='none';
    speakerCallBtn.style.display='none';
    acceptCallBtn.style.display='none';
    // Let CSS .show control it on the next call.
    requestAnimationFrame(() => { if (callOverlay) callOverlay.style.display = ''; });
  }

  function markCallConnected(startedAt) {
    callStatus.textContent = 'Connected';
    startCallTimer(startedAt || Date.now());
    speakerCallBtn.style.display = 'block';
  }

  async function sendSignal(to, type, payload, callId) {
    await client.from('call_signals').insert({ sender_id:myId, recipient_id:to, type, call_id:callId, payload });
  }

  function setupCallChannel() {
    if (!myId) return;
    if (callChannel) client.removeChannel(callChannel);
    callChannel=client.channel('calls_'+myId).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:`recipient_id=eq.${myId}`}, async ({new:sig})=>{
      if (sig.type==='offer') {
        if (callEnding || peerConnection || activeCallId) return;
        incomingOffer=sig; activeCallId=sig.call_id; activeCallPeer=sig.sender_id;
        showCallUI(sig.payload?.name || 'Someone','Incoming voice call',true);
      } else if (sig.call_id===activeCallId) await handleCallSignal(sig);
    }).subscribe();
  }

  async function setupCallAudio(stream){
    remoteAudio.autoplay=true;
    remoteAudio.playsInline=true;
    remoteAudio.muted=false;
    remoteAudio.volume=1;
    remoteAudio.srcObject=stream;

    // Resume Web Audio from the call's user interaction when possible.
    try {
      if(!callAudioContext) callAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      if(callAudioContext.state === 'suspended') await callAudioContext.resume();
      if(callAudioSource) { try { callAudioSource.disconnect(); } catch(e){} }
      callAudioSource = callAudioContext.createMediaStreamSource(stream);
      const gain = callAudioContext.createGain();
      gain.gain.value = 1.35;
      callAudioSource.connect(gain);
      gain.connect(callAudioContext.destination);
      callAudioStream=stream;
    } catch(e) {
      // The normal <audio> element remains the fallback.
    }
    try { await remoteAudio.play(); } catch(e) {
      setTimeout(()=>remoteAudio.play().catch(()=>{}),150);
    }
  }

  async function toggleSpeaker(){
    if(!remoteAudio.srcObject) return;
    speakerOn=!speakerOn;
    speakerCallBtn.classList.toggle('on',speakerOn);
    speakerCallBtn.textContent=speakerOn?'🔊':'🔈';
    speakerCallBtn.title=speakerOn?'Speaker on':'Speaker off';

    // setSinkId is supported by some desktop browsers. "default" asks
    // the browser to use its normal/default loudspeaker output.
    if(typeof remoteAudio.setSinkId === 'function'){
      try { await remoteAudio.setSinkId('default'); } catch(e) {}
    }
    remoteAudio.volume = speakerOn ? 1 : 0.85;

    if(callAudioContext && callAudioContext.state==='suspended'){
      try { await callAudioContext.resume(); } catch(e){}
    }
    try { await remoteAudio.play(); } catch(e){}
  }

  async function createPeer(peerId, initiator) {
    if (peerConnection) { try{peerConnection.close();}catch(e){} }
    pendingIce=[];
    const gen = callGen;
    const stream = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    if (gen !== callGen) {
      // The call was cancelled/hung up while we were waiting on mic permission.
      // Don't resurrect a connection for a call that's already over.
      stream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} });
      throw new Error('call cancelled');
    }
    localStream = stream;
    peerConnection=new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));

    peerConnection.ontrack = async (e) => {
      const stream = (e.streams && e.streams[0]) ? e.streams[0] :
        (remoteAudio.srcObject instanceof MediaStream ? remoteAudio.srcObject : new MediaStream());
      if(!e.streams || !e.streams[0]) stream.addTrack(e.track);
      await setupCallAudio(stream);
    };

    peerConnection.onicecandidate=e=>{
      if(e.candidate && activeCallId)
        sendSignal(peerId,'candidate',e.candidate.toJSON(),activeCallId).catch(()=>{});
    };
    peerConnection.onconnectionstatechange=()=>{
      if(peerConnection && ['failed','disconnected','closed'].includes(peerConnection.connectionState)){
        if(peerConnection.connectionState==='failed') showBanner('Call connection failed. Please try again.');
        endCall(false);
      }
    };

    if(initiator){
      const offer=await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await sendSignal(peerId,'offer',{sdp:offer.sdp,name:myName},activeCallId);
    }
  }

  async function handleCallSignal(sig){
    if(sig.type==='hangup'){
      endCall(false);
      return;
    }
    if(sig.type==='connected'){
      if(sig.call_id === activeCallId) markCallConnected(sig.payload?.startedAt || Date.now());
      return;
    }
    if(!peerConnection){
      if(sig.type==='candidate') pendingIce.push(sig.payload);
      return;
    }
    if(sig.type==='answer'){
      await peerConnection.setRemoteDescription(sig.payload);
      while(pendingIce.length){
        try { await peerConnection.addIceCandidate(pendingIce.shift()); } catch(e) {}
      }
    } else if(sig.type==='candidate'){
      if(!peerConnection.remoteDescription){
        pendingIce.push(sig.payload);
      } else {
        try { await peerConnection.addIceCandidate(sig.payload); } catch(e) {}
      }
    }
  }

  async function startCall(){
    if(currentChat.type!=='dm') return;
    activeCallId=makeClientId(); activeCallPeer=currentChat.id;
    showCallUI(currentChat.name,'Calling…',false);
    try { await createPeer(activeCallPeer,true); }
    catch(e){
      if (e && e.message !== 'call cancelled') showBanner('Could not start call. Check microphone permission.');
      endCall(false);
    }
  }
  async function acceptCall(){
    if(!incomingOffer) return;

    const sig=incomingOffer;
    incomingOffer=null;
    currentChat={type:'dm',id:sig.sender_id,name:sig.payload?.name||'Someone'};
    chatTitle.textContent=currentChat.name;
    activeCallId=sig.call_id;
    activeCallPeer=sig.sender_id;

    // Accept is a real user gesture: unlock microphone + audio output now.
    try {
      if(!callAudioContext) callAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      if(callAudioContext.state==='suspended') await callAudioContext.resume();
    } catch(e){}

    showCallUI(currentChat.name,'Connecting…',false);
    try {
      await createPeer(activeCallPeer,false);

      await peerConnection.setRemoteDescription({
        type:'offer',
        sdp:sig.payload.sdp
      });

      while(pendingIce.length){
        try { await peerConnection.addIceCandidate(pendingIce.shift()); } catch(e){}
      }

      const answer=await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await sendSignal(activeCallPeer,'answer',{
        type:'answer',
        sdp:answer.sdp
      },activeCallId);

      const connectedAt = Date.now();
      await sendSignal(activeCallPeer,'connected',{startedAt:connectedAt},activeCallId);
      showCallUI(currentChat.name,'Connected',false);
      markCallConnected(connectedAt);
      speakerOn=true;
      speakerCallBtn.classList.add('on');
      speakerCallBtn.textContent='🔊';
      try { await remoteAudio.play(); } catch(e){}
    } catch(e){
      if (e && e.message !== 'call cancelled') {
        console.error('Accept call error:',e);
        showBanner('Could not accept call. Allow microphone permission and try again.');
      }
      endCall(false);
    }
  }
  async function endCall(sendHangup=true, reason='ended'){
    // Close the UI and local media immediately. Network/WebRTC cleanup happens
    // afterward so Hang Up / Decline can never leave the call card stuck.
    if(callEnding) return;
    callEnding = true;
    callGen++; // invalidate any call setup still in flight (e.g. awaiting mic permission)

    const peer = activeCallPeer;
    const cid = activeCallId;

    hideCallUI();

    if(sendHangup && peer && cid){
      sendSignal(peer,'hangup',{reason},cid).catch(()=>{});
    }

    if(localStream){
      localStream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} });
    }
    localStream=null;

    const pc = peerConnection;
    peerConnection=null;
    if(pc){
      try { pc.ontrack=null; pc.onicecandidate=null; pc.onconnectionstatechange=null; } catch(e){}
      try { pc.close(); } catch(e){}
    }

    activeCallPeer=null;
    activeCallId=null;
    incomingOffer=null;
    pendingIce=[];

    if(callAudioSource){ try{callAudioSource.disconnect();}catch(e){} callAudioSource=null; }
    if(callAudioContext){
      const ctx=callAudioContext;
      callAudioContext=null;
      ctx.close().catch(()=>{});
    }
    callAudioStream=null;

    try { remoteAudio.pause(); } catch(e){}
    remoteAudio.srcObject=null;
    remoteAudio.muted=false;
    remoteAudio.volume=1;

    updateCallButtons();
    callEnding=false;
  }

  callBtn.addEventListener('click',startCall);
  acceptCallBtn.addEventListener('click',acceptCall);
  declineCallBtn.addEventListener('click', ()=>{
    // Decline must close immediately, even if the signal insert is slow.
    if(incomingOffer && incomingOffer.sender_id && incomingOffer.call_id){
      const peer=incomingOffer.sender_id;
      const cid=incomingOffer.call_id;
      incomingOffer=null;
      sendSignal(peer,'hangup',{reason:'declined'},cid).catch(()=>{});
      endCall(false);
    } else {
      endCall(true);
    }
  });
  hangupCallBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    e.stopPropagation();
    endCall(true);
  });
  speakerCallBtn.addEventListener('click',toggleSpeaker);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const text = input.value.trim();
    const mediaFile = pendingMediaFile;
    const mediaType = pendingMediaType;

    if (!text && !mediaFile) return;
    if (!myId) return;

    input.value = '';

    // Keep the preview URL alive for the optimistic message.
    const localPreviewUrl = pendingMediaPreviewUrl;

    pendingMediaFile = null;
    pendingMediaType = null;
    pendingMediaPreviewUrl = null;

    imagePreviewThumb.src = '';
    videoPreviewThumb.src = '';
    imagePreviewRow.classList.remove('show');

    input.focus();

    const tempId = makeClientId();
    const replyToIdAtSend = replyingTo ? replyingTo.id : null;

    pendingByText.push({
      tempId,
      text,
      hasImage: !!mediaFile
    });

    addRow({
      uid: myId,
      username: myName,
      text,
      image_url: mediaType === 'image' ? (localPreviewUrl || null) : null,
      video_url: mediaType === 'video' ? (localPreviewUrl || null) : null,
      audio_url: mediaType === 'audio' ? (localPreviewUrl || null) : null,
      reply_to_id: replyToIdAtSend,
      _tempId: tempId
    }, true);

    clearReply();

    try {
      let image_url = null;
      let video_url = null;
      let audio_url = null;

      if (mediaFile) {
        const fallbackExt = mediaType === 'audio' ? 'webm' : (mediaType === 'video' ? 'mp4' : 'jpg');
        const ext = (mediaFile.name.split('.').pop() || fallbackExt)
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '') || fallbackExt;

        const path = `${myId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

        const { error: upErr } = await client
          .storage
          .from('chat-images')
          .upload(path, mediaFile, {
            cacheControl: '3600',
            upsert: false
          });

        if (upErr) throw upErr;

        const publicUrl = client
          .storage
          .from('chat-images')
          .getPublicUrl(path)
          .data
          .publicUrl;

        if (mediaType === 'audio') {
          audio_url = publicUrl;
        } else if (mediaType === 'video') {
          video_url = publicUrl;
        } else {
          image_url = publicUrl;
        }
      }

      const { error: insErr } = await client
        .from('messages')
        .insert({
          uid: myId,
          username: myName,
          text: text,
          image_url: image_url,
          video_url: video_url,
          audio_url: audio_url,
          reply_to_id: replyToIdAtSend,
          recipient_id: currentChat.type === 'dm' ? currentChat.id : null
        });

      if (insErr) throw insErr;

      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);

    } catch (err) {
      showBanner('Could not send: ' + (err.message || 'unknown error'));

      const idx = pendingByText.findIndex(p => p.tempId === tempId);
      if (idx !== -1) pendingByText.splice(idx, 1);

      const el = feed.querySelector(`[data-temp-id="${tempId}"]`);
      if (el) el.remove();

      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);
    }
  });

  client.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      myId = session.user.id;
      myName = session.user.user_metadata?.display_name || session.user.email.split('@')[0];
      whoEl.textContent = 'you: ' + myName;
      signOutBtn.style.display = 'inline';
      authOverlay.style.display = 'none';
      setTimeout(async () => {
        await ensureProfile();
        await loadContacts();
        setupCallChannel();
        updateCallButtons();
        initPresence();
        subscribeTyping();
      }, 0);
      loadAndSubscribe();
    } else {
      myId = null; myName = null;
      whoEl.textContent = '';
      signOutBtn.style.display = 'none';
      authOverlay.style.display = 'flex';
      feed.innerHTML = '<div class="empty">Sign in to see the chat.</div>';
      if (channel) { client.removeChannel(channel); channel = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      endCall(false);
      if (callChannel) { client.removeChannel(callChannel); callChannel = null; }
      if (presenceChannel) { client.removeChannel(presenceChannel); presenceChannel = null; }
      if (typingChannel) { client.removeChannel(typingChannel); typingChannel = null; }
      if (reactionsChannel) { client.removeChannel(reactionsChannel); reactionsChannel = null; }
      if (lastSeenHeartbeat) { clearInterval(lastSeenHeartbeat); lastSeenHeartbeat = null; }
      seenIds.clear();
      lastSeenAt = null;
    }
  });

  // --- Read receipts (DMs) ---
  async function markDmReadRpc() {
    if (!myId || currentChat.type !== 'dm') return;
    try { await client.rpc('mark_dm_read', { partner_id: currentChat.id }); } catch (e) { /* migration may not be applied yet */ }
  }

  // --- Typing indicators: ephemeral broadcast, nothing written to the database ---
  function subscribeTyping() {
    if (typingChannel) { client.removeChannel(typingChannel); typingChannel = null; }
    typingUsers.clear();
    renderTypingIndicator();
    if (!myId) return;
    const name = 'typing:' + chatKey(currentChat);
    typingChannel = client.channel(name, { config: { broadcast: { self: false } } });
    typingChannel.on('broadcast', { event: 'typing' }, ({ payload }) => {
      if (!payload || payload.userId === myId) return;
      if (payload.state === 'start') {
        typingUsers.set(payload.userId, payload.username || 'Someone');
      } else {
        typingUsers.delete(payload.userId);
      }
      renderTypingIndicator();
    }).subscribe();
  }

  function renderTypingIndicator() {
    const names = Array.from(typingUsers.values());
    if (!names.length) { typingIndicator.style.display = 'none'; typingIndicator.textContent = ''; return; }
    let text;
    if (names.length === 1) text = names[0] + ' is typing…';
    else if (names.length === 2) text = names[0] + ' and ' + names[1] + ' are typing…';
    else text = 'Several people are typing…';
    typingIndicator.textContent = text;
    typingIndicator.style.display = 'block';
  }

  function broadcastTyping(state) {
    if (!typingChannel || !myId) return;
    typingChannel.send({ type: 'broadcast', event: 'typing', payload: { userId: myId, username: myName, state } });
  }

  input.addEventListener('input', () => {
    if (!input.value.trim()) { broadcastTyping('stop'); clearTimeout(typingHideTimer); return; }
    const now = Date.now();
    if (now - typingSendThrottle > 2000) {
      typingSendThrottle = now;
      broadcastTyping('start');
    }
    clearTimeout(typingHideTimer);
    typingHideTimer = setTimeout(() => broadcastTyping('stop'), 3000);
  });
  form.addEventListener('submit', () => { clearTimeout(typingHideTimer); broadcastTyping('stop'); });

  // --- Presence: who's online right now, plus a last_seen heartbeat for everyone else ---
  function initPresence() {
    if (presenceChannel) { client.removeChannel(presenceChannel); presenceChannel = null; }
    presenceChannel = client.channel('presence:online', { config: { presence: { key: myId } } });
    presenceChannel
      .on('presence', { event: 'sync' }, () => {
        const state = presenceChannel.presenceState();
        onlineUserIds.clear();
        Object.keys(state).forEach(uid => onlineUserIds.add(uid));
        updateChatSubtitle();
        renderContacts();
      })
      .subscribe(async (status) => {
        if (status === 'SUBSCRIBED') await presenceChannel.track({ online_at: new Date().toISOString() });
      });

    if (lastSeenHeartbeat) clearInterval(lastSeenHeartbeat);
    const beat = () => { if (myId && document.visibilityState === 'visible') client.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', myId).then(()=>{}, ()=>{}); };
    beat();
    lastSeenHeartbeat = setInterval(beat, 25000);
  }

  // --- Reply-to composer bar ---
  function setReplyTo(m) {
    replyingTo = { id: m.id, username: m.uid === myId ? 'You' : (m.username || 'Someone'), preview: formatQuotePreview(m) };
    replyPreviewName.textContent = 'Replying to ' + replyingTo.username;
    replyPreviewText.textContent = replyingTo.preview;
    replyPreviewRow.classList.add('show');
    input.focus();
  }
  function clearReply() {
    replyingTo = null;
    replyPreviewRow.classList.remove('show');
  }
  replyPreviewClose.addEventListener('click', clearReply);

  // --- Edit / delete own messages ---
  async function startEditMessage(row, m) {
    const bubble = row.querySelector('.bubble');
    if (!bubble || m.image_url || m.video_url || m.audio_url) { showBanner('Only text messages can be edited.'); return; }
    const original = m.text || '';
    bubble.innerHTML = '';
    bubble.classList.add('edit-box');
    const box = document.createElement('div');
    box.className = 'edit-box';
    const ta = document.createElement('textarea');
    ta.value = original;
    ta.rows = 2;
    const actions = document.createElement('div');
    actions.className = 'edit-actions';
    const cancel = document.createElement('button');
    cancel.type = 'button'; cancel.className = 'cancel-btn'; cancel.textContent = 'Cancel';
    const save = document.createElement('button');
    save.type = 'button'; save.className = 'save-btn'; save.textContent = 'Save';
    actions.appendChild(cancel); actions.appendChild(save);
    box.appendChild(ta); box.appendChild(actions);
    bubble.appendChild(box);
    ta.focus();
    cancel.addEventListener('click', () => handleMessageUpdate(messagesById.get(m.id) || m));
    save.addEventListener('click', async () => {
      const newText = ta.value.trim();
      if (!newText) { showBanner('Message cannot be empty.'); return; }
      const { error } = await client.from('messages').update({ text: newText, edited_at: new Date().toISOString() }).eq('id', m.id);
      if (error) { showBanner('Could not edit: ' + error.message); return; }
      handleMessageUpdate({ ...m, text: newText, edited_at: new Date().toISOString() });
    });
  }

  async function deleteMessage(m) {
    if (!confirm('Delete this message for everyone?')) return;
    const { error } = await client.from('messages').update({ deleted_at: new Date().toISOString() }).eq('id', m.id);
    if (error) { showBanner('Could not delete: ' + error.message); return; }
    handleMessageUpdate({ ...m, deleted_at: new Date().toISOString() });
  }

  // --- Long-press / right-click context menu (react, reply, copy, edit, delete) ---
  function openMsgMenu(x, y, m, row) {
    menuTargetId = m.id;
    msgMenuEmojiRow.innerHTML = '';
    REACTION_EMOJIS.forEach(emoji => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = emoji;
      b.addEventListener('click', () => { toggleReaction(m.id, emoji); closeMsgMenu(); });
      msgMenuEmojiRow.appendChild(b);
    });
    const isMe = m.uid === myId;
    const isDeleted = !!m.deleted_at;
    msgMenu.querySelector('[data-action="edit"]').style.display = (isMe && !isDeleted && !(m.image_url||m.video_url||m.audio_url)) ? 'block' : 'none';
    msgMenu.querySelector('[data-action="delete"]').style.display = (isMe && !isDeleted) ? 'block' : 'none';
    msgMenu.querySelector('[data-action="reply"]').style.display = isDeleted ? 'none' : 'block';
    msgMenu.querySelector('[data-action="copy"]').style.display = (isDeleted || m.image_url||m.video_url||m.audio_url) ? 'none' : 'block';
    msgMenuEmojiRow.style.display = isDeleted ? 'none' : 'flex';

    msgMenu.style.display = 'block';
    msgMenu.style.visibility = 'hidden';
    requestAnimationFrame(() => {
      const rect = msgMenu.getBoundingClientRect();
      let left = Math.min(x, window.innerWidth - rect.width - 10);
      let top = Math.min(y, window.innerHeight - rect.height - 10);
      left = Math.max(10, left); top = Math.max(10, top);
      msgMenu.style.left = left + 'px';
      msgMenu.style.top = top + 'px';
      msgMenu.style.visibility = 'visible';
    });
    msgMenu.classList.add('show');
    msgMenuOverlay.classList.add('show');
  }
  function closeMsgMenu() {
    msgMenu.classList.remove('show');
    msgMenu.style.display = '';
    msgMenuOverlay.classList.remove('show');
    menuTargetId = null;
  }
  msgMenuOverlay.addEventListener('click', closeMsgMenu);
  msgMenu.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn || menuTargetId == null) return;
    const m = messagesById.get(menuTargetId);
    const row = feed.querySelector(`[data-id="${menuTargetId}"]`);
    const action = btn.dataset.action;
    closeMsgMenu();
    if (!m) return;
    if (action === 'reply') setReplyTo(m);
    else if (action === 'copy') { if (m.text) navigator.clipboard?.writeText(m.text).catch(()=>{}); }
    else if (action === 'edit') { if (row) startEditMessage(row, m); }
    else if (action === 'delete') deleteMessage(m);
  });

  let longPressTimer = null;
  let longPressOpened = false;
  let longPressRow = null;

  feed.addEventListener('contextmenu', (e) => {
    const row = e.target.closest('.row[data-id]');
    if (!row) return;
    e.preventDefault();
    const m = messagesById.get(Number(row.dataset.id)) || messagesById.get(row.dataset.id);
    if (m) openMsgMenu(e.clientX, e.clientY, m, row);
  });

  feed.addEventListener('touchstart', (e) => {
    const row = e.target.closest('.row[data-id]');
    if (!row) return;
    clearTimeout(longPressTimer);
    longPressOpened = false;
    longPressRow = row;
    const touch = e.touches[0];
    longPressTimer = setTimeout(() => {
      const m = messagesById.get(Number(row.dataset.id)) || messagesById.get(row.dataset.id);
      if (m) {
        longPressOpened = true;
        openMsgMenu(touch.clientX, touch.clientY, m, row);
      }
    }, 480);
  }, { passive: true });

  feed.addEventListener('touchmove', () => {
    clearTimeout(longPressTimer);
  }, { passive: true });

  feed.addEventListener('touchend', () => {
    clearTimeout(longPressTimer);
    // The long-press menu is a temporary touch preview. Release the finger
    // and it disappears instead of remaining stuck over the chat.
    if (longPressOpened) closeMsgMenu();
    longPressOpened = false;
    longPressRow = null;
  }, { passive: true });

  feed.addEventListener('touchcancel', () => {
    clearTimeout(longPressTimer);
    if (longPressOpened) closeMsgMenu();
    longPressOpened = false;
    longPressRow = null;
  }, { passive: true });

  // --- Scroll-to-latest ---
  feed.addEventListener('scroll', () => {
    const nearBottom = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 80;
    scrollLatestBtn.classList.toggle('show', !nearBottom);
  });
  scrollLatestBtn.addEventListener('click', () => { feed.scrollTop = feed.scrollHeight; });
})();
</script>
</body>
