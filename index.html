<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
  :root {
    --bg: #eef0f4; --panel: #ffffff; --text: #14161a; --muted: #7b8090;
    --bubble-other: #ffffff; --bubble-me: #5b6bf5; --bubble-me-2: #7c6bf7; --bubble-me-text: #ffffff;
    --border: #e6e8ee; --accent: #5b6bf5; --accent-soft: #eef0ff;
    --danger: #ef4444; --success: #22c55e; --shadow: 0 1px 2px rgba(20,22,30,.04), 0 8px 24px rgba(20,22,30,.06);
    --shadow-lg: 0 20px 60px rgba(20,22,30,.22);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1014; --panel:#191b22; --text:#f1f2f6; --muted:#8b8fa3;
      --bubble-other:#232531; --bubble-me:#6a75f8; --bubble-me-2:#8b6bf7; --bubble-me-text:#fff;
      --border:#2a2d3a; --accent:#7c85ff; --accent-soft:#20223a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lg: 0 20px 60px rgba(0,0,0,.55);
    }
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent; }

  svg.icon { width:19px; height:19px; display:block; stroke:currentColor; fill:none;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  header { padding: max(13px, env(safe-area-inset-top,0px)) 14px 13px; background:var(--panel);
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0;
    box-shadow: var(--shadow); position:relative; z-index:2; }
  .headerTitle { display:flex; flex-direction:column; min-width:0; gap:1px; }
  header h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .chat-status { display:none; align-items:center; gap:5px; font-size:11.5px; color:var(--muted); font-weight:500; }
  .chat-status.show { display:flex; }
  .chat-status .dot-sm { width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .chat-status.online { color:var(--success); }
  .chat-status.online .dot-sm { background:var(--success); box-shadow:0 0 0 2px color-mix(in srgb, var(--success) 22%, transparent); }
  header .sub { font-size:12px; color:var(--muted); margin-left:auto; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #signOutBtn { border:none; background:transparent; color:var(--muted); font-size:12px; cursor:pointer;
    padding:4px 0; font-weight:500; }
  #signOutBtn:hover { color:var(--danger); }

  #feed { flex:1; overflow-y:auto; padding:16px 12px 10px; display:flex; flex-direction:column; gap:10px;
    scroll-behavior: smooth; }
  .row { display:flex; gap:8px; max-width:78%; align-items:flex-end; }
  .row.enter { animation: rowIn .25s cubic-bezier(.2,.8,.3,1); }
  @keyframes rowIn { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .row.other { align-self:flex-start; }
  .avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center;
    box-shadow:0 0 0 2px var(--panel); }
  .bubble-wrap { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .name { font-size:11px; color:var(--muted); padding:0 3px; font-weight:600; }
  .row.me .name { text-align:right; }
  .bubble { padding:9px 14px; border-radius:18px; font-size:14.5px; line-height:1.4;
    word-wrap:break-word; white-space:pre-wrap; box-shadow: 0 1px 1px rgba(20,22,30,.03); }
  .bubble.has-img { padding:4px; }
  .bubble.has-img img { display:block; max-width:220px; max-height:280px; width:100%;
    border-radius:14px; object-fit:cover; }
  .bubble.has-img .caption { padding:7px 9px 4px; }
  .row.other .bubble { background:var(--bubble-other); border:1px solid var(--border); border-bottom-left-radius:5px; }
  .row.me .bubble { background:linear-gradient(135deg, var(--bubble-me), var(--bubble-me-2)); color:var(--bubble-me-text); border-bottom-right-radius:5px; }
  .empty { margin:auto; text-align:center; color:var(--muted); font-size:14px; padding:20px; }

  form#composer { display:flex; gap:7px; padding:10px 10px;
    padding-bottom:max(10px, env(safe-area-inset-bottom,0px));
    background:var(--panel); border-top:1px solid var(--border); flex-shrink:0;
    flex-wrap:wrap; align-items:center; }

  .iconBtn, #attachBtn, .voiceBtn, .callBtn, #send, .menuBtn {
    border:none; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, background .15s ease, opacity .15s ease, color .15s ease;
  }
  .iconBtn:active, #attachBtn:active, .voiceBtn:active, .callBtn:active, #send:active, .menuBtn:active { transform:scale(.92); }

  #attachBtn, .voiceBtn, .callBtn { background:var(--bg); color:var(--muted); width:38px; height:38px; border-radius:50%; }
  #attachBtn:hover, .voiceBtn:hover, .callBtn:hover { background:var(--accent-soft); color:var(--accent); }
  #attachBtn:disabled, .callBtn:disabled, .voiceBtn:disabled { opacity:.4; cursor:default; }
  #attachBtn:disabled:hover, .voiceBtn:disabled:hover, .callBtn:disabled:hover { background:var(--bg); color:var(--muted); }

  #imagePreviewRow { display:none; width:100%; align-items:center; gap:10px; padding:0 2px 10px; }
  #imagePreviewRow.show { display:flex; }
  #imagePreviewRow img { width:52px; height:52px; object-fit:cover; border-radius:12px; border:1px solid var(--border); }
  #imagePreviewRow .clear { border:none; background:var(--bg); color:var(--muted); width:24px; height:24px;
    border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #imagePreviewRow .clear svg { width:12px; height:12px; }
  #imagePreviewRow .note { font-size:12px; color:var(--muted); font-weight:500; }

  #input { flex:1; border:1px solid var(--border); border-radius:22px; padding:11px 16px;
    font-size:14.5px; background:var(--bg); color:var(--text); outline:none; min-width:0;
    transition:border-color .15s ease, background .15s ease; }
  #input:focus { border-color:var(--accent); background:var(--panel); }
  #send { background:linear-gradient(135deg, var(--bubble-me), var(--bubble-me-2)); color:#fff; border-radius:50%;
    width:40px; height:40px; box-shadow:0 4px 14px rgba(91,107,245,.35); }
  #send:disabled { opacity:.45; cursor:default; box-shadow:none; }
  #send svg { width:17px; height:17px; margin-left:1px; }

  .voiceBtn.recording { background:var(--danger); color:#fff; animation:pulse 1.1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); box-shadow:0 0 0 8px rgba(239,68,68,.15); } }

  #callOverlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(10,11,15,.6); backdrop-filter:blur(6px); padding:20px; }
  #callOverlay.show { display:flex; }
  #callCard { width:min(340px,100%); background:var(--panel); border-radius:24px; padding:28px 24px; text-align:center;
    box-shadow:var(--shadow-lg); }
  #callAvatar { width:76px; height:76px; border-radius:50%; margin:0 auto 14px; background-size:cover; background-position:center;
    box-shadow:0 0 0 4px var(--accent-soft); }
  #callTitle { font-size:19px; font-weight:700; margin-bottom:4px; letter-spacing:-.01em; }
  #callStatus { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .callActions { display:flex; justify-content:center; gap:16px; }
  .callActions button { border:none; border-radius:50%; width:54px; height:54px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:transform .12s ease; }
  .callActions button:active { transform:scale(.92); }
  #acceptCallBtn { background:var(--success); color:#fff; }
  #declineCallBtn, #hangupCallBtn { background:var(--danger); color:#fff; }
  #speakerCallBtn { background:var(--bg); color:var(--muted); display:none; }
  #speakerCallBtn.on { background:var(--accent); color:#fff; }
  #speakerCallBtn:disabled { opacity:.5; }
  #banner { padding:10px 16px; font-size:13px; color:var(--muted); text-align:center; }

  #authOverlay { position:fixed; inset:0; background:rgba(10,11,15,.5); backdrop-filter:blur(4px); display:flex;
    align-items:center; justify-content:center; z-index:10; padding:20px; }
  #authCard { background:var(--panel); border-radius:20px; padding:26px 24px; width:100%; max-width:340px;
    box-shadow:var(--shadow-lg); }
  #authCard h2 { margin:0 0 4px; font-size:18px; letter-spacing:-.01em; }
  #authCard p.sub { margin:0 0 18px; font-size:13px; color:var(--muted); }
  .tabs { display:flex; gap:4px; background:var(--bg); border-radius:12px; padding:3px; margin-bottom:18px; }
  .tabs button { flex:1; border:none; background:transparent; padding:9px; border-radius:9px;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:background .15s ease, color .15s ease; }
  .tabs button.active { background:var(--panel); color:var(--text); box-shadow:var(--shadow); }
  #authCard input { width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px; margin-bottom:10px; outline:none;
    transition:border-color .15s ease; }
  #authCard input:focus { border-color:var(--accent); }
  #authCard button.primary { width:100%; border:none; background:linear-gradient(135deg, var(--bubble-me), var(--bubble-me-2));
    color:#fff; padding:12px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px;
    box-shadow:0 4px 14px rgba(91,107,245,.3); }
  #authError { color:var(--danger); font-size:12px; margin:-4px 0 8px; min-height:14px; font-weight:500; }
  #authNote { font-size:12px; color:var(--muted); margin-top:10px; }

  .menuBtn { background:var(--bg); color:var(--text); width:34px; height:34px; border-radius:50%; position:relative; }
  .menuBtn:hover { background:var(--accent-soft); color:var(--accent); }

  .media-wrap { position:relative; }
  .media-wrap img, .media-wrap video { cursor:zoom-in; }
  .media-wrap video { max-width:220px; max-height:280px; width:100%; border-radius:14px;
    display:block; background:#000; }
  .dl-btn { position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.55); color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
  .dl-btn svg { width:14px; height:14px; }
  .media-wrap:hover .dl-btn, .media-wrap:active .dl-btn { opacity:1; }
  @media (hover:none) { .dl-btn { opacity:1; } }

  #lightbox { position:fixed; inset:0; background:rgba(6,7,10,0.92); z-index:20; display:none;
    align-items:center; justify-content:center; padding:20px;
    padding-top:max(20px, env(safe-area-inset-top,0px));
    padding-bottom:max(20px, env(safe-area-inset-bottom,0px)); }
  #lightbox.show { display:flex; }
  #lightbox img, #lightbox video { max-width:100%; max-height:100%; border-radius:12px; }
  #lightbox .lbControls { position:absolute; top:max(16px, env(safe-area-inset-top,0px)); right:16px;
    display:flex; gap:10px; }
  #lightbox .lbControls button { border:none; background:rgba(255,255,255,0.12); color:#fff;
    width:40px; height:40px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s ease; }
  #lightbox .lbControls button:hover { background:rgba(255,255,255,0.22); }

  #contactsOverlay { position:fixed; inset:0; background:rgba(10,11,15,.4); z-index:15; display:none; }
  #contactsOverlay.show { display:block; }
  #contactsPanel { position:absolute; top:0; left:0; height:100%; width:min(80%, 300px);
    background:var(--panel); display:flex; flex-direction:column; transform:translateX(-100%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1); padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:var(--shadow-lg); }
  #contactsOverlay.show #contactsPanel { transform:translateX(0); }
  .panel-header { display:flex; align-items:center; justify-content:space-between; padding:16px;
    border-bottom:1px solid var(--border); font-weight:700; font-size:15px; flex-shrink:0; }
  .panel-header button { border:none; background:var(--bg); color:var(--muted); width:30px; height:30px;
    border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .panel-header button svg { width:13px; height:13px; }
  #contactSearch { margin:10px 12px; padding:10px 14px; border:1px solid var(--border); border-radius:22px;
    background:var(--bg); color:var(--text); font-size:14px; outline:none; width:calc(100% - 24px); flex-shrink:0;
    transition:border-color .15s ease; }
  #contactSearch:focus { border-color:var(--accent); }
  #contactsList { flex:1; overflow-y:auto; }
  .contact-item .cinfo { min-width:0; display:flex; flex-direction:column; }
  .contact-item .cemail { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contact-item .cemail.online { color:var(--success); font-weight:600; }
  .contact-item { display:flex; align-items:center; gap:11px; padding:12px 16px; cursor:pointer; position:relative;
    transition:background .12s ease; }
  .contact-item:active, .contact-item.active { background:var(--accent-soft); }
  .contact-item .avatar { width:34px; height:34px; }
  .avatar-wrap { position:relative; width:34px; height:34px; flex-shrink:0; }
  .avatar-wrap .avatar { width:100%; height:100%; }
  .status-dot { position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%;
    background:var(--muted); border:2px solid var(--panel); }
  .status-dot.online { background:var(--success); }
  .contact-item .cname { font-size:14px; font-weight:600; }
  .unread-badge { margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--danger);
    color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .menu-unread-badge { position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:9px;
    background:var(--danger); color:#fff; font-size:10px; font-weight:700; display:none; align-items:center;
    justify-content:center; border:2px solid var(--panel); }
  .contact-empty { padding:16px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<div id="authOverlay">
  <div id="authCard">
    <div class="tabs">
      <button id="tabSignIn" class="active" type="button">Sign in</button>
      <button id="tabSignUp" type="button">Create account</button>
    </div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Sign in to join the chat.</p>
    <div id="nameField" style="display:none">
      <input id="displayName" placeholder="Display name" maxlength="24" />
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="authError"></div>
    <button id="authSubmit" class="primary" type="button">Sign in</button>
    <div id="authNote"></div>
  </div>
</div>

<header>
  <button class="menuBtn" id="menuBtn" type="button" title="Chats"><svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg><span id="menuUnreadBadge" class="menu-unread-badge"></span></button>
  <div class="headerTitle">
    <h1 id="chatTitle">Group Chat</h1>
    <span id="chatStatus" class="chat-status"><span class="dot-sm"></span><span id="chatStatusText"></span></span>
  </div>
  <div class="sub"><span id="who"></span><button id="signOutBtn" style="display:none">Sign out</button></div>
</header>

<div id="contactsOverlay">
  <div id="contactsPanel">
    <div class="panel-header">
      <span>Chats</span>
      <button id="closeContacts" type="button"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <input id="contactSearch" type="search" placeholder="Search name or email…" autocomplete="off" />
    <div id="contactsList"><div class="contact-empty">Loading…</div></div>
  </div>
</div>

<div id="feed"><div class="empty">Loading…</div></div>
<div id="banner" style="display:none"></div>
<form id="composer">
  <div id="imagePreviewRow">
    <img id="imagePreviewThumb" alt="" />
    <video id="videoPreviewThumb" muted playsinline style="display:none"></video>
    <span class="note" id="imagePreviewNote">Image attached</span>
    <button type="button" class="clear" id="clearImageBtn"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
  <button id="attachBtn" type="button" title="Attach photo or video"><svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a5 5 0 01-7.07-7.07l9.19-9.19a3.5 3.5 0 015 5l-9.2 9.19a1.5 1.5 0 01-2.12-2.12l8.49-8.48"/></svg></button>
  <button id="voiceBtn" class="voiceBtn" type="button" title="Record voice message"><svg class="icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
  <button id="callBtn" class="callBtn" type="button" title="Voice call"><svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/></svg></button>
  <input id="fileInput" type="file" accept="image/*,video/*" style="display:none" />
  <input id="input" placeholder="Message…" autocomplete="off" maxlength="2000" />
  <button id="send" type="submit" title="Send"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3.4 20.6l17.5-8.2a1 1 0 000-1.8L3.4 2.4a1 1 0 00-1.4 1.1L4.5 11H13a1 1 0 010 2H4.5l-2.5 7.5a1 1 0 001.4 1.1z"/></svg></button>
</form>

<div id="callOverlay">
  <div id="callCard">
    <div id="callAvatar"></div>
    <div id="callTitle">Incoming call</div>
    <div id="callStatus">Voice call</div>
    <div id="callTimer" style="display:none;font-size:24px;font-weight:700;margin-top:8px;">00:00</div>
    <div class="callActions">
      <button id="acceptCallBtn" type="button" title="Accept"><svg class="icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/></svg></button>
      <button id="declineCallBtn" type="button" title="Decline"><svg class="icon" viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/></svg></button>
      <button id="hangupCallBtn" type="button" title="Hang up" style="display:none"><svg class="icon" viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/></svg></button>
      <button id="speakerCallBtn" type="button" title="Speaker" style="display:none"><svg class="icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/></svg></button>
    </div>
  </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<div id="lightbox">
  <div class="lbControls">
    <button id="lbDownload" type="button" title="Download"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></button>

  async function downloadMedia(url, type) {

      const ext = (url.split('.').pop() || '').split('?')[0];
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = `${type || 'file'}_${Date.now()}${ext ? '.' + ext : ''}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objUrl);

  function addRow(m, scroll) {

      mediaWrap.appendChild(mediaEl);

        cap.textContent = m.text;

      bubble.textContent = m.text || '';

    wrap.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(wrap);
    feed.appendChild(row);
    if (scroll !== false) feed.scrollTop = feed.scrollHeight;

    if (m.id != null) seenIds.add(m.id);
    if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
  }

  function drawIncoming(m) {
    if (!belongsToCurrentChat(m)) return;
    if (m.id != null && seenIds.has(m.id)) return; // already on screen, via realtime or poll
    if (m.uid === myId) {
      const idx = pendingByText.findIndex(p => p.text === m.text && p.hasImage === !!(m.image_url || m.video_url));
      if (idx !== -1) {
        // Already drawn optimistically when we sent it, this is just the server echo.
        pendingByText.splice(idx, 1);
        if (m.id != null) seenIds.add(m.id);
        if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
        return;
      }
    }
    addRow(m, true);
  }

  // Quiet safety net: if the realtime socket ever drops without us noticing (backgrounded tab,
  // flaky mobile network), this catches anything we missed. Cheap, since it only asks for
  // messages newer than the last one we've already drawn.
  async function pollForMissed() {
    if (!myId) return;
    let q = client.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
    q = applyChatFilter(q);
    q = lastSeenAt ? q.gt('created_at', lastSeenAt) : q.limit(200);
    const { data, error } = await q;
    if (!error && data) data.forEach(drawIncoming);
  }

  function subscribeRealtime() {
    if (channel) client.removeChannel(channel);
    channel = client
      .channel('public:messages:' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        drawIncoming(payload.new);
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          // Reconnect shortly, and immediately poll so nothing sent during the gap is missed.
          setTimeout(() => { if (myId) subscribeRealtime(); }, 2000);
          pollForMissed();
        }
      });
  }

  async function loadAndSubscribe() {
    let q = client
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(200);

    q = applyChatFilter(q);

    const { data, error } = await q;

    if (error) {
      showBanner('Could not load messages: ' + error.message);
      feed.innerHTML = '<div class="empty">Couldn\'t load chat. See message below.</div>';
    } else {
      renderAll(data || []);
    }

    subscribeRealtime();

    if (!pollTimer) {
      pollTimer = setInterval(pollForMissed, 8000); // background safety net, not the main path
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && myId) pollForMissed();
    });
  }

  // Messages we've drawn locally before the server confirms them, keyed by a client-generated id.
  // When the realtime INSERT event for our own message arrives, we match it here instead of
  // drawing it a second time.
  const pendingByText = []; // FIFO of { tempId, text, hasImage }

  async function sendVoiceBlob(blob) {
    if (!myId || currentChat.type !== 'dm') { showBanner('Open a private chat to send a voice message.'); return; }
    const localUrl = URL.createObjectURL(blob);
    const tempId = makeClientId();
    const text = '';
    pendingByText.push({ tempId, text, hasImage: true });
    addRow({ uid: myId, username: myName, text: '', audio_url: localUrl, _tempId: tempId }, true);
    try {
      const path = `${myId}/voice_${Date.now()}_${Math.random().toString(36).slice(2,8)}.webm`;
      const { error: upErr } = await client.storage.from('chat-images').upload(path, blob, { contentType: blob.type || 'audio/webm', cacheControl:'3600', upsert:false });
      if (upErr) throw upErr;
      const audio_url = client.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
      const { error: insErr } = await client.from('messages').insert({ uid:myId, username:myName, text:'', image_url:null, video_url:null, audio_url, recipient_id:currentChat.id });
      if (insErr) throw insErr;
      URL.revokeObjectURL(localUrl);
    } catch (err) {
      showBanner('Could not send voice message: ' + (err.message || 'unknown error'));
      const el = feed.querySelector(`[data-temp-id="${tempId}"]`); if (el) el.remove();
      const idx=pendingByText.findIndex(p=>p.tempId===tempId); if(idx!==-1) pendingByText.splice(idx,1);
      URL.revokeObjectURL(localUrl);
    }
  }

  voiceBtn.addEventListener('click', async () => {
    if (currentChat.type !== 'dm') { showBanner('Open a private chat first.'); return; }
    if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      voiceChunks=[];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size) voiceChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t=>t.stop());
        voiceBtn.classList.remove('recording'); voiceBtn.innerHTML=ICON_MIC;
        const blob = new Blob(voiceChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
        if (blob.size) await sendVoiceBlob(blob);
        mediaRecorder=null; voiceChunks=[];
      };
      mediaRecorder.start();
      voiceBtn.classList.add('recording'); voiceBtn.innerHTML=ICON_STOP;
    } catch (err) { showBanner('Microphone permission is needed for voice messages.'); }
  });

  function updateCallButtons() {
    const enabled = currentChat.type === 'dm' && !!myId;
    callBtn.disabled = !enabled || !!peerConnection;
    voiceBtn.disabled = !enabled;
  }

  function startCallTimer(startedAt) {
    callStartedAt = Number(startedAt) || Date.now();
    callTimer.style.display = 'block';
    const tick = () => {
      const seconds = Math.max(0, Math.floor((Date.now() - callStartedAt) / 1000));
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const sec = seconds % 60;
      callTimer.textContent = h
        ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };
    clearInterval(callTimerInterval);
    tick();
    callTimerInterval = setInterval(tick, 1000);
  }

  function stopCallTimer() {
    clearInterval(callTimerInterval);
    callTimerInterval = null;
    callStartedAt = null;
    callTimer.style.display = 'none';
    callTimer.textContent = '00:00';
  }

  function showCallUI(name, status, incoming=false) {
    callAvatar.style.backgroundImage=`url("${initialsAvatar(name || '?')}")`;
    callTitle.textContent = name || 'Voice call';
    callStatus.textContent = status;
    acceptCallBtn.style.display = incoming ? 'block' : 'none';
    declineCallBtn.style.display = 'block';
    hangupCallBtn.style.display = incoming ? 'none' : 'block';
    speakerCallBtn.style.display = incoming ? 'none' : 'block';
    callOverlay.classList.add('show');
  }

  function hideCallUI(){
    callOverlay.classList.remove('show');
    stopCallTimer();
    speakerOn=false;
    speakerCallBtn.classList.remove('on');
    speakerCallBtn.innerHTML=ICON_SPEAKER_OFF;
    speakerCallBtn.title='Speaker';
  }

  function markCallConnected(startedAt) {
    callStatus.textContent = 'Connected';
    startCallTimer(startedAt || Date.now());
    speakerCallBtn.style.display = 'block';
  }

  async function sendSignal(to, type, payload, callId) {
    await client.from('call_signals').insert({ sender_id:myId, recipient_id:to, type, call_id:callId, payload });
  }

  // --- Presence: a lightweight shared channel that tracks who's currently online. ---
  function setupPresence() {
    if (!myId) return;
    if (presenceChannel) client.removeChannel(presenceChannel);
    presenceChannel = client.channel('online-users', { config: { presence: { key: myId } } });
    presenceChannel.on('presence', { event: 'sync' }, () => {
      onlineIds = new Set(Object.keys(presenceChannel.presenceState()));
      renderContacts();
      updateChatStatus();
    });
    presenceChannel.subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        try { await presenceChannel.track({ online_at: new Date().toISOString() }); } catch (e) {}
      }
    });
  }

  function teardownPresence() {
    if (presenceChannel) { client.removeChannel(presenceChannel); presenceChannel = null; }
    onlineIds = new Set();
  }

  function updateChatStatus() {
    if (currentChat.type !== 'dm') {
      chatStatus.classList.remove('show', 'online');
      return;
    }
    const online = onlineIds.has(currentChat.id);
    chatStatus.classList.add('show');
    chatStatus.classList.toggle('online', online);
    chatStatusText.textContent = online ? 'Active now' : 'Offline';
  }

  function setupCallChannel() {
    if (!myId) return;
    if (callChannel) client.removeChannel(callChannel);
    callChannel=client.channel('calls_'+myId).on('postgres_changes',{event:'INSERT',schema:'public',table:'call_signals',filter:`recipient_id=eq.${myId}`}, async ({new:sig})=>{
      if (sig.type==='offer') {
        incomingOffer=sig; activeCallId=sig.call_id; activeCallPeer=sig.sender_id;
        showCallUI(sig.payload?.name || 'Someone','Incoming voice call',true);
      } else if (sig.call_id===activeCallId) await handleCallSignal(sig);
    }).subscribe();
  }

  async function setupCallAudio(stream){
    remoteAudio.autoplay=true;
    remoteAudio.playsInline=true;
    remoteAudio.muted=false;
    remoteAudio.volume=1;
    remoteAudio.srcObject=stream;

    // Resume Web Audio from the call's user interaction when possible.
    try {
      if(!callAudioContext) callAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      if(callAudioContext.state === 'suspended') await callAudioContext.resume();
      if(callAudioSource) { try { callAudioSource.disconnect(); } catch(e){} }
      callAudioSource = callAudioContext.createMediaStreamSource(stream);
      const gain = callAudioContext.createGain();
      gain.gain.value = 1.35;
      callAudioSource.connect(gain);
      gain.connect(callAudioContext.destination);
      callAudioStream=stream;
    } catch(e) {
      // The normal <audio> element remains the fallback.
    }
    try { await remoteAudio.play(); } catch(e) {
      setTimeout(()=>remoteAudio.play().catch(()=>{}),150);
    }
  }

  async function toggleSpeaker(){
    if(!remoteAudio.srcObject) return;
    speakerOn=!speakerOn;
    speakerCallBtn.classList.toggle('on',speakerOn);
    speakerCallBtn.innerHTML=speakerOn?ICON_SPEAKER_ON:ICON_SPEAKER_OFF;
    speakerCallBtn.title=speakerOn?'Speaker on':'Speaker off';

    // setSinkId is supported by some desktop browsers. "default" asks
    // the browser to use its normal/default loudspeaker output.
    if(typeof remoteAudio.setSinkId === 'function'){
      try { await remoteAudio.setSinkId('default'); } catch(e) {}
    }
    remoteAudio.volume = speakerOn ? 1 : 0.85;

    if(callAudioContext && callAudioContext.state==='suspended'){
      try { await callAudioContext.resume(); } catch(e){}
    }
    try { await remoteAudio.play(); } catch(e){}
  }

  async function createPeer(peerId, initiator) {
    if (peerConnection) { try{peerConnection.close();}catch(e){} }
    pendingIce=[];
    localStream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    });
    peerConnection=new RTCPeerConnection(rtcConfig);
    localStream.getTracks().forEach(t=>peerConnection.addTrack(t,localStream));

    peerConnection.ontrack = async (e) => {
      const stream = (e.streams && e.streams[0]) ? e.streams[0] :
        (remoteAudio.srcObject instanceof MediaStream ? remoteAudio.srcObject : new MediaStream());
      if(!e.streams || !e.streams[0]) stream.addTrack(e.track);
      await setupCallAudio(stream);
    };

    peerConnection.onicecandidate=e=>{
      if(e.candidate && activeCallId)
        sendSignal(peerId,'candidate',e.candidate.toJSON(),activeCallId).catch(()=>{});
    };
    peerConnection.onconnectionstatechange=()=>{
      if(peerConnection && ['failed','disconnected','closed'].includes(peerConnection.connectionState)){
        if(peerConnection.connectionState==='failed') showBanner('Call connection failed. Please try again.');
        endCall(false);
      }
    };

    if(initiator){
      const offer=await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      await sendSignal(peerId,'offer',{sdp:offer.sdp,name:myName},activeCallId);
    }
  }

  async function handleCallSignal(sig){
    if(sig.type==='hangup'){
      endCall(false);
      return;
    }
    if(sig.type==='connected'){
      if(sig.call_id === activeCallId) markCallConnected(sig.payload?.startedAt || Date.now());
      return;
    }
    if(!peerConnection){
      if(sig.type==='candidate') pendingIce.push(sig.payload);
      return;
    }
    if(sig.type==='answer'){
      await peerConnection.setRemoteDescription(sig.payload);
      while(pendingIce.length){
        try { await peerConnection.addIceCandidate(pendingIce.shift()); } catch(e) {}
      }
    } else if(sig.type==='candidate'){
      if(!peerConnection.remoteDescription){
        pendingIce.push(sig.payload);
      } else {
        try { await peerConnection.addIceCandidate(sig.payload); } catch(e) {}
      }
    }
  }

  async function startCall(){
    if(currentChat.type!=='dm') return;
    activeCallId=makeClientId(); activeCallPeer=currentChat.id;
    showCallUI(currentChat.name,'Calling…',false);
    try { await createPeer(activeCallPeer,true); }
    catch(e){ showBanner('Could not start call. Check microphone permission.'); endCall(false); }
  }
  async function acceptCall(){
    if(!incomingOffer) return;

    const sig=incomingOffer;
    incomingOffer=null;
    currentChat={type:'dm',id:sig.sender_id,name:sig.payload?.name||'Someone'};
    chatTitle.textContent=currentChat.name;
    activeCallId=sig.call_id;
    activeCallPeer=sig.sender_id;

    // Accept is a real user gesture: unlock microphone + audio output now.
    try {
      if(!callAudioContext) callAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      if(callAudioContext.state==='suspended') await callAudioContext.resume();
    } catch(e){}

    showCallUI(currentChat.name,'Connecting…',false);
    try {
      await createPeer(activeCallPeer,false);

      await peerConnection.setRemoteDescription({
        type:'offer',
        sdp:sig.payload.sdp
      });

      while(pendingIce.length){
        try { await peerConnection.addIceCandidate(pendingIce.shift()); } catch(e){}
      }

      const answer=await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await sendSignal(activeCallPeer,'answer',{
        type:'answer',
        sdp:answer.sdp
      },activeCallId);

      const connectedAt = Date.now();
      await sendSignal(activeCallPeer,'connected',{startedAt:connectedAt},activeCallId);
      showCallUI(currentChat.name,'Connected',false);
      markCallConnected(connectedAt);
      speakerOn=true;
      speakerCallBtn.classList.add('on');
      speakerCallBtn.innerHTML=ICON_SPEAKER_ON;
      try { await remoteAudio.play(); } catch(e){}
    } catch(e){
      console.error('Accept call error:',e);
      showBanner('Could not accept call. Allow microphone permission and try again.');
      endCall(false);
    }
  }
  async function endCall(sendHangup=true){
    // Clean up the local call FIRST. Do not wait for Supabase before closing
    // the call, otherwise a slow/offline database request can make Hang Up
    // appear not to work.
    if(callEnding) return;
    callEnding = true;

    const peer = activeCallPeer;
    const cid = activeCallId;

    // Send the hangup in the background. The local user should never have to
    // wait for the network/database before the call screen closes.
    if(sendHangup && peer && cid){
      sendSignal(peer,'hangup',{reason:'ended'},cid).catch(()=>{});
    }

    if(localStream){
      localStream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} });
    }
    localStream=null;

    const pc = peerConnection;
    peerConnection=null;
    if(pc){
      try { pc.ontrack=null; pc.onicecandidate=null; pc.onconnectionstatechange=null; } catch(e){}
      try { pc.close(); } catch(e){}
    }

    activeCallPeer=null;
    activeCallId=null;
    incomingOffer=null;
    pendingIce=[];

    try {
      if(callAudioSource){ try{callAudioSource.disconnect();}catch(e){} callAudioSource=null; }
      if(callAudioContext){ try{await callAudioContext.close();}catch(e){} callAudioContext=null; }
      callAudioStream=null;

      try { remoteAudio.pause(); } catch(e){}
      remoteAudio.srcObject=null;
      remoteAudio.muted=false;
      remoteAudio.volume=1;
    } catch(e){ console.error('Call cleanup error:', e); }

    hideCallUI();
    updateCallButtons();

    // Allow another call immediately after ending this one.
    callEnding=false;
  }

  callBtn.addEventListener('click',startCall);
  acceptCallBtn.addEventListener('click',acceptCall);
  declineCallBtn.addEventListener('click', ()=>{
    // Decline must close immediately, even if the signal insert is slow.
    if(incomingOffer && incomingOffer.sender_id && incomingOffer.call_id){
      const peer=incomingOffer.sender_id;
      const cid=incomingOffer.call_id;
      incomingOffer=null;
      sendSignal(peer,'hangup',{reason:'declined'},cid).catch(()=>{});
      endCall(false);
    } else {
      endCall(true);
    }
  });
  hangupCallBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    e.stopPropagation();
    endCall(true);
  });
  speakerCallBtn.addEventListener('click',toggleSpeaker);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const text = input.value.trim();
    const mediaFile = pendingMediaFile;
    const mediaType = pendingMediaType;

    if (!text && !mediaFile) return;
    if (!myId) return;

    input.value = '';

    // Keep the preview URL alive for the optimistic message.
    const localPreviewUrl = pendingMediaPreviewUrl;

    pendingMediaFile = null;
    pendingMediaType = null;
    pendingMediaPreviewUrl = null;

    imagePreviewThumb.src = '';
    videoPreviewThumb.src = '';
    imagePreviewRow.classList.remove('show');

    input.focus();

    const tempId = makeClientId();

    pendingByText.push({
      tempId,
      text,
      hasImage: !!mediaFile
    });

    addRow({
      uid: myId,
      username: myName,
      text,
      image_url: mediaType === 'image' ? (localPreviewUrl || null) : null,
      video_url: mediaType === 'video' ? (localPreviewUrl || null) : null,
      audio_url: mediaType === 'audio' ? (localPreviewUrl || null) : null,
      _tempId: tempId
    }, true);

    try {
      let image_url = null;
      let video_url = null;
      let audio_url = null;

      if (mediaFile) {
        const fallbackExt = mediaType === 'audio' ? 'webm' : (mediaType === 'video' ? 'mp4' : 'jpg');
        const ext = (mediaFile.name.split('.').pop() || fallbackExt)
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '') || fallbackExt;

        const path = `${myId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

        const { error: upErr } = await client
          .storage
          .from('chat-images')
          .upload(path, mediaFile, {
            cacheControl: '3600',
            upsert: false
          });

        if (upErr) throw upErr;

        const publicUrl = client
          .storage
          .from('chat-images')
          .getPublicUrl(path)
          .data
          .publicUrl;

        if (mediaType === 'audio') {
          audio_url = publicUrl;
        } else if (mediaType === 'video') {
          video_url = publicUrl;
        } else {
          image_url = publicUrl;
        }
      }

      const { error: insErr } = await client
        .from('messages')
        .insert({
          uid: myId,
          username: myName,
          text: text,
          image_url: image_url,
          video_url: video_url,
          audio_url: audio_url,
          recipient_id: currentChat.type === 'dm' ? currentChat.id : null
        });

      if (insErr) throw insErr;

      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);

    } catch (err) {
      showBanner('Could not send: ' + (err.message || 'unknown error'));

      const idx = pendingByText.findIndex(p => p.tempId === tempId);
      if (idx !== -1) pendingByText.splice(idx, 1);

      const el = feed.querySelector(`[data-temp-id="${tempId}"]`);
      if (el) el.remove();

      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);
    }
  });

  client.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      myId = session.user.id;
      myName = session.user.user_metadata?.display_name || session.user.email.split('@')[0];
      whoEl.textContent = 'you: ' + myName;
      signOutBtn.style.display = 'inline';
      authOverlay.style.display = 'none';
      setTimeout(async () => {
        await ensureProfile();
        await loadContacts();
        setupCallChannel();
        setupPresence();
        updateCallButtons();
      }, 0);
      loadAndSubscribe();
    } else {
      myId = null; myName = null;
      whoEl.textContent = '';
      signOutBtn.style.display = 'none';
      authOverlay.style.display = 'flex';
      feed.innerHTML = '<div class="empty">Sign in to see the chat.</div>';
      if (channel) { client.removeChannel(channel); channel = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      endCall(false);
      if (callChannel) { client.removeChannel(callChannel); callChannel = null; }
      teardownPresence();
      chatStatus.classList.remove('show', 'online');
      seenIds.clear();
      lastSeenAt = null;
    }
  });
})();
</script>
</body>
</html>
