<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1a1a1a; --muted: #767a82;
    --bubble-other: #ffffff; --bubble-me: #4f7cff; --bubble-me-text: #ffffff; --border: #e4e6ea;
    --danger: #e0393e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#16171a; --panel:#202226; --text:#f0f0f2; --muted:#9a9ea6;
      --bubble-other:#2b2d33; --bubble-me:#4f7cff; --bubble-me-text:#fff; --border:#33353b;
    }
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; }
  header { padding: max(14px, env(safe-area-inset-top,0px)) 16px 14px; background:var(--panel);
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#34c759; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { font-size:12px; color:var(--muted); margin-left:auto; display:flex; align-items:center; gap:8px; }
  #signOutBtn { border:none; background:transparent; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  #feed { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px;
    scroll-behavior: smooth; }
  .row { display:flex; gap:8px; max-width:80%; align-items:flex-end; }
  .row.enter { animation: rowIn .22s ease-out; }
  @keyframes rowIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .row.other { align-self:flex-start; }
  .avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center; }
  .bubble-wrap { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .name { font-size:11px; color:var(--muted); padding:0 2px; }
  .row.me .name { text-align:right; }
  .bubble { padding:9px 13px; border-radius:16px; font-size:14.5px; line-height:1.35;
    word-wrap:break-word; white-space:pre-wrap; }
  .bubble.has-img { padding:4px; }
  .bubble.has-img img { display:block; max-width:220px; max-height:280px; width:100%;
    border-radius:12px; object-fit:cover; }
  .bubble.has-img .caption { padding:6px 8px 3px; }
  .row.other .bubble { background:var(--bubble-other); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .row.me .bubble { background:var(--bubble-me); color:var(--bubble-me-text); border-bottom-right-radius:4px; }
  .empty { margin:auto; text-align:center; color:var(--muted); font-size:14px; padding:20px; }
  form#composer { display:flex; gap:8px; padding:10px 12px;
    padding-bottom:max(10px, env(safe-area-inset-bottom,0px));
    background:var(--panel); border-top:1px solid var(--border); flex-shrink:0;
    flex-wrap:wrap; align-items:center; }
  #attachBtn { border:none; background:var(--bg); color:var(--muted); width:36px; height:36px;
    border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; }
  #attachBtn:disabled { opacity:.5; cursor:default; }
  #imagePreviewRow { display:none; width:100%; align-items:center; gap:8px; padding:0 0 8px; }
  #imagePreviewRow.show { display:flex; }
  #imagePreviewRow img { width:52px; height:52px; object-fit:cover; border-radius:10px; border:1px solid var(--border); }
  #imagePreviewRow .clear { border:none; background:var(--bg); color:var(--muted); width:22px; height:22px;
    border-radius:50%; cursor:pointer; font-size:12px; line-height:1; }
  #imagePreviewRow .note { font-size:12px; color:var(--muted); }
  #input { flex:1; border:1px solid var(--border); border-radius:20px; padding:10px 15px;
    font-size:14.5px; background:var(--bg); color:var(--text); outline:none; min-width:0; }
  #send { border:none; background:var(--bubble-me); color:#fff; border-radius:20px;
    padding:0 18px; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0; }
  #send:disabled { opacity:.5; cursor:default; }
  #banner { padding:10px 16px; font-size:13px; color:var(--muted); text-align:center; }

  #authOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex;
    align-items:center; justify-content:center; z-index:10; padding:20px; }
  #authCard { background:var(--panel); border-radius:14px; padding:22px; width:100%; max-width:340px; }
  #authCard h2 { margin:0 0 4px; font-size:16px; }
  #authCard p.sub { margin:0 0 16px; font-size:13px; color:var(--muted); }
  .tabs { display:flex; gap:4px; background:var(--bg); border-radius:10px; padding:3px; margin-bottom:16px; }
  .tabs button { flex:1; border:none; background:transparent; padding:8px; border-radius:8px;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button.active { background:var(--panel); color:var(--text); }
  #authCard input { width:100%; padding:10px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px; margin-bottom:10px; }
  #authCard button.primary { width:100%; border:none; background:var(--bubble-me); color:#fff;
    padding:10px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
  #authError { color:var(--danger); font-size:12px; margin:-4px 0 8px; min-height:14px; }
  #authNote { font-size:12px; color:var(--muted); margin-top:10px; }

  .menuBtn { border:none; background:var(--bg); color:var(--text); width:30px; height:30px;
    border-radius:50%; font-size:14px; cursor:pointer; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }

  .media-wrap { position:relative; }
  .media-wrap img, .media-wrap video { cursor:zoom-in; }
  .media-wrap video { max-width:220px; max-height:280px; width:100%; border-radius:12px;
    display:block; background:#000; }
  .dl-btn { position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
    border:none; background:rgba(0,0,0,0.55); color:#fff; font-size:13px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s; }
  .media-wrap:hover .dl-btn, .media-wrap:active .dl-btn { opacity:1; }
  @media (hover:none) { .dl-btn { opacity:1; } }

  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:20; display:none;
    align-items:center; justify-content:center; padding:20px;
    padding-top:max(20px, env(safe-area-inset-top,0px));
    padding-bottom:max(20px, env(safe-area-inset-bottom,0px)); }
  #lightbox.show { display:flex; }
  #lightbox img, #lightbox video { max-width:100%; max-height:100%; border-radius:8px; }
  #lightbox .lbControls { position:absolute; top:max(16px, env(safe-area-inset-top,0px)); right:16px;
    display:flex; gap:10px; }
  #lightbox .lbControls button { border:none; background:rgba(255,255,255,0.15); color:#fff;
    width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }

  #contactsOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:15; display:none; }
  #contactsOverlay.show { display:block; }
  #contactsPanel { position:absolute; top:0; left:0; height:100%; width:min(80%, 300px);
    background:var(--panel); display:flex; flex-direction:column; transform:translateX(-100%);
    transition:transform .2s ease-out; padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px); }
  #contactsOverlay.show #contactsPanel { transform:translateX(0); }
  .panel-header { display:flex; align-items:center; justify-content:space-between; padding:16px;
    border-bottom:1px solid var(--border); font-weight:600; font-size:15px; flex-shrink:0; }
  .panel-header button { border:none; background:var(--bg); color:var(--muted); width:28px; height:28px;
    border-radius:50%; cursor:pointer; font-size:13px; }
  #contactSearch { margin:10px 12px; padding:10px 13px; border:1px solid var(--border); border-radius:20px;
    background:var(--bg); color:var(--text); font-size:14px; outline:none; width:calc(100% - 24px); flex-shrink:0; }
  #contactsList { flex:1; overflow-y:auto; }
  .contact-item .cinfo { min-width:0; display:flex; flex-direction:column; }
  .contact-item .cemail { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contact-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; }
  .contact-item:active, .contact-item.active { background:var(--bg); }
  .contact-item .avatar { width:32px; height:32px; }
  .contact-item .cname { font-size:14px; }
  .contact-empty { padding:16px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<div id="authOverlay">
  <div id="authCard">
    <div class="tabs">
      <button id="tabSignIn" class="active" type="button">Sign in</button>
      <button id="tabSignUp" type="button">Create account</button>
    </div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Sign in to join the chat.</p>
    <div id="nameField" style="display:none">
      <input id="displayName" placeholder="Display name" maxlength="24" />
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="authError"></div>
    <button id="authSubmit" class="primary" type="button">Sign in</button>
    <div id="authNote"></div>
  </div>
</div>

<header>
  <button class="menuBtn" id="menuBtn" type="button" title="Chats">☰</button>
  <div class="dot"></div>
  <h1 id="chatTitle">Group Chat</h1>
  <div class="sub"><span id="who"></span><button id="signOutBtn" style="display:none">Sign out</button></div>
</header>

<div id="contactsOverlay">
  <div id="contactsPanel">
    <div class="panel-header">
      <span>Chats</span>
      <button id="closeContacts" type="button">✕</button>
    </div>
    <input id="contactSearch" type="search" placeholder="Search name or email…" autocomplete="off" />
    <div id="contactsList"><div class="contact-empty">Loading…</div></div>
  </div>
</div>

<div id="feed"><div class="empty">Loading…</div></div>
<div id="banner" style="display:none"></div>
<form id="composer">
  <div id="imagePreviewRow">
    <img id="imagePreviewThumb" alt="" />
    <video id="videoPreviewThumb" muted playsinline style="display:none"></video>
    <span class="note" id="imagePreviewNote">Image attached</span>
    <button type="button" class="clear" id="clearImageBtn">✕</button>
  </div>
  <button id="attachBtn" type="button" title="Attach photo or video">📎</button>
  <input id="fileInput" type="file" accept="image/*,video/*" style="display:none" />
  <input id="input" placeholder="Message…" autocomplete="off" maxlength="2000" />
  <button id="send" type="submit">Send</button>
</form>

<div id="lightbox">
  <div class="lbControls">
    <button id="lbDownload" type="button" title="Download">⬇</button>
    <button id="lbClose" type="button" title="Close">✕</button>
  </div>
  <div id="lbContent"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://wwcmntdvuecbuydhqsqo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_nFxiub_VpITzHtdiiTaAWw_sa9-qVif";

  const feed = document.getElementById('feed');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const whoEl = document.getElementById('who');
  const signOutBtn = document.getElementById('signOutBtn');
  const banner = document.getElementById('banner');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewRow = document.getElementById('imagePreviewRow');
  const imagePreviewThumb = document.getElementById('imagePreviewThumb');
  const videoPreviewThumb = document.getElementById('videoPreviewThumb');
  const imagePreviewNote = document.getElementById('imagePreviewNote');
  const clearImageBtn = document.getElementById('clearImageBtn');

  const menuBtn = document.getElementById('menuBtn');
  const chatTitle = document.getElementById('chatTitle');
  const contactsOverlay = document.getElementById('contactsOverlay');
  const closeContacts = document.getElementById('closeContacts');
  const contactsList = document.getElementById('contactsList');
  const contactSearch = document.getElementById('contactSearch');

  const lightbox = document.getElementById('lightbox');
  const lbContent = document.getElementById('lbContent');
  const lbClose = document.getElementById('lbClose');
  const lbDownload = document.getElementById('lbDownload');

  const authOverlay = document.getElementById('authOverlay');
  const tabSignIn = document.getElementById('tabSignIn');
  const tabSignUp = document.getElementById('tabSignUp');
  const authTitle = document.getElementById('authTitle');
  const authSub = document.getElementById('authSub');
  const nameField = document.getElementById('nameField');
  const displayNameInput = document.getElementById('displayName');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const authError = document.getElementById('authError');
  const authSubmit = document.getElementById('authSubmit');
  const authNote = document.getElementById('authNote');

  function showBanner(text) { banner.style.display = 'block'; banner.textContent = text; }

  function initialsAvatar(name) {
    const letter = (name || '?').trim().charAt(0).toUpperCase() || '?';
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><rect width="26" height="26" rx="13" fill="hsl(${hue},55%,50%)"/><text x="13" y="18" font-size="12" text-anchor="middle" fill="#fff" font-family="sans-serif">${letter}</text></svg>`
    );
  }

  if (!window.supabase) {
    showBanner('Supabase library failed to load (check your internet connection or ad blocker).');
    feed.innerHTML = '<div class="empty">Chat unavailable.</div>';
    sendBtn.disabled = true;
    return;
  }
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = 'signin'; // or 'signup'
  tabSignIn.addEventListener('click', () => setMode('signin'));
  tabSignUp.addEventListener('click', () => setMode('signup'));

  function setMode(m) {
    mode = m;
    authError.textContent = '';
    authNote.textContent = '';
    if (m === 'signin') {
      tabSignIn.classList.add('active'); tabSignUp.classList.remove('active');
      authTitle.textContent = 'Welcome back';
      authSub.textContent = 'Sign in to join the chat.';
      nameField.style.display = 'none';
      authSubmit.textContent = 'Sign in';
    } else {
      tabSignUp.classList.add('active'); tabSignIn.classList.remove('active');
      authTitle.textContent = 'Create your account';
      authSub.textContent = 'Pick a display name others will see.';
      nameField.style.display = 'block';
      authSubmit.textContent = 'Create account';
    }
  }

  authSubmit.addEventListener('click', async () => {
    authError.textContent = '';
    authNote.textContent = '';
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { authError.textContent = 'Enter an email and password.'; return; }
    authSubmit.disabled = true;
    try {
      if (mode === 'signup') {
        const name = displayNameInput.value.trim();
        if (!name) { authError.textContent = 'Enter a display name.'; authSubmit.disabled = false; return; }
        const { data, error } = await client.auth.signUp({
          email, password, options: { data: { display_name: name } }
        });
        if (error) throw error;
        if (data.session) {
          // signed in immediately (email confirmation disabled)
        } else {
          authNote.textContent = 'Check your email to confirm your account, then sign in.';
          setMode('signin');
        }
      } else {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      authError.textContent = e.message || 'Something went wrong.';
    } finally {
      authSubmit.disabled = false;
    }
  });

  signOutBtn.addEventListener('click', async () => {
    await client.auth.signOut();
  });

  let myId = null;
  let myName = null;
  let channel = null;
  let pollTimer = null;
  let lastSeenAt = null; // created_at of the newest message we've rendered, drives the fallback poll
  const seenIds = new Set(); // db ids already drawn, so realtime + polling never double-render

  // Which conversation is currently open: the shared group chat, or a private 1:1 with one contact.
  let currentChat = { type: 'group', id: null, name: 'Group Chat' };
  let contacts = []; // other users available for a private chat, loaded from "profiles"

  function makeClientId() {
    return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
  }

  // --- Private chats: contacts are read from a "profiles" table (id + username per user). ---
  async function ensureProfile() {
    if (!myId) return;
    try {
      const { data: userData } = await client.auth.getUser();
      const email = userData?.user?.email || '';
      await client.from('profiles').upsert(
        { id: myId, username: myName, email },
        { onConflict: 'id' }
      );
    } catch (e) { /* profiles table may not be set up yet; contacts list will explain */ }
  }

  async function loadContacts() {
    if (!myId) return;
    const { data, error } = await client.from('profiles').select('id, username, email').neq('id', myId).order('username');
    if (error) {
      contacts = [];
      renderContacts();
      showBanner('Private chats need a "profiles" table in Supabase — see setup notes.');
      return;
    }
    contacts = data || [];
    renderContacts();
  }

  function renderContacts() {
    contactsList.innerHTML = '';

    const search = (contactSearch.value || '').trim().toLowerCase();
    const filtered = contacts.filter(c => {
      const name = (c.username || '').toLowerCase();
      const email = (c.email || '').toLowerCase();
      return !search || name.includes(search) || email.includes(search);
    });

    const groupItem = document.createElement('div');
    groupItem.className = 'contact-item' + (currentChat.type === 'group' ? ' active' : '');
    const groupAvatar = document.createElement('div');
    groupAvatar.className = 'avatar';
    groupAvatar.style.cssText = 'background:var(--bubble-me);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;';
    groupAvatar.textContent = '#';
    const groupName = document.createElement('span');
    groupName.className = 'cname';
    groupName.textContent = 'Group Chat';
    groupItem.appendChild(groupAvatar);
    groupItem.appendChild(groupName);
    groupItem.addEventListener('click', () => selectChat({ type: 'group', id: null, name: 'Group Chat' }));
    contactsList.appendChild(groupItem);

    if (!contacts.length) {
      const empty = document.createElement('div');
      empty.className = 'contact-empty';
      empty.textContent = 'No other users yet.';
      contactsList.appendChild(empty);
      return;
    }
    if (!filtered.length) {
      const empty = document.createElement('div');
      empty.className = 'contact-empty';
      empty.textContent = 'No users found.';
      contactsList.appendChild(empty);
      return;
    }
    for (const c of filtered) {
      const item = document.createElement('div');
      item.className = 'contact-item' + (currentChat.type === 'dm' && currentChat.id === c.id ? ' active' : '');
      const av = document.createElement('div');
      av.className = 'avatar';
      av.style.backgroundImage = `url("${initialsAvatar(c.username || '?')}")`;
      const info = document.createElement('div');
      info.className = 'cinfo';
      const name = document.createElement('span');
      name.className = 'cname';
      name.textContent = c.username || 'Unknown';
      const email = document.createElement('span');
      email.className = 'cemail';
      email.textContent = c.email || '';
      info.appendChild(name);
      if (c.email) info.appendChild(email);
      item.appendChild(av);
      item.appendChild(info);
      item.addEventListener('click', () => selectChat({ type: 'dm', id: c.id, name: c.username || 'Unknown' }));
      contactsList.appendChild(item);
    }
  }

  function selectChat(chat) {
    currentChat = chat;
    chatTitle.textContent = chat.type === 'group' ? 'Group Chat' : chat.name;
    contactsOverlay.classList.remove('show');
    renderContacts();
    resetAndLoad();
  }

  function resetAndLoad() {
    feed.innerHTML = '<div class="empty">Loading…</div>';
    seenIds.clear();
    lastSeenAt = null;
    pendingByText.length = 0;
    loadAndSubscribe();
  }

  contactSearch.addEventListener('input', renderContacts);
  menuBtn.addEventListener('click', () => {
    contactSearch.value = '';
    loadContacts();
    contactsOverlay.classList.add('show');
    setTimeout(() => contactSearch.focus(), 50);
  });
  closeContacts.addEventListener('click', () => contactsOverlay.classList.remove('show'));
  contactsOverlay.addEventListener('click', (e) => {
    if (e.target === contactsOverlay) contactsOverlay.classList.remove('show');
  });

  // A message belongs to the group chat when recipient_id is null; otherwise it belongs to the
  // private chat between its uid and its recipient_id.
  function applyChatFilter(q) {
    if (currentChat.type === 'group') return q.is('recipient_id', null);
    return q.or(`and(uid.eq.${myId},recipient_id.eq.${currentChat.id}),and(uid.eq.${currentChat.id},recipient_id.eq.${myId})`);
  }

  function belongsToCurrentChat(m) {
    if (currentChat.type === 'group') return m.recipient_id == null;
    return (m.uid === myId && m.recipient_id === currentChat.id) || (m.uid === currentChat.id && m.recipient_id === myId);
  }

  // --- Lightbox: full-size view + download for any photo or video in the feed ---
  function openLightbox(url, type) {
    if (!url) return;
    lbContent.innerHTML = '';
    let el;
    if (type === 'video') {
      el = document.createElement('video');
      el.src = url;
      el.controls = true;
      el.autoplay = true;
      el.playsInline = true;
    } else {
      el = document.createElement('img');
      el.src = url;
      el.alt = 'image';
    }
    lbContent.appendChild(el);
    lbContent.dataset.url = url;
    lbContent.dataset.type = type;
    lightbox.classList.add('show');
  }

  function closeLightbox() {
    lightbox.classList.remove('show');
    lbContent.innerHTML = '';
  }

  lbClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  lbDownload.addEventListener('click', () => downloadMedia(lbContent.dataset.url, lbContent.dataset.type));

  async function downloadMedia(url, type) {
    if (!url) return;
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Download failed');
      const blob = await res.blob();
      const ext = (url.split('.').pop() || '').split('?')[0];
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = `${type || 'file'}_${Date.now()}${ext ? '.' + ext : ''}`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(objUrl);
    } catch (err) {
      showBanner('Could not download: ' + (err.message || 'unknown error'));
    }
  }

  // --- Media attach: a photo or a video ---
  const MAX_IMAGE_MB = 8;
  const MAX_VIDEO_MB = 50; // Supabase's default free-tier per-file storage limit is 50MB
  let pendingMediaFile = null;
  let pendingMediaType = null; // 'image' | 'video'
  let pendingMediaPreviewUrl = null;

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    const isImage = file.type.startsWith('image/');
    const isVideo = file.type.startsWith('video/');
    if (!isImage && !isVideo) {
      showBanner('Please choose an image or video file.');
      return;
    }
    const limitMb = isImage ? MAX_IMAGE_MB : MAX_VIDEO_MB;
    if (file.size > limitMb * 1024 * 1024) {
      showBanner(`${isImage ? 'Image' : 'Video'} is too large (max ${limitMb}MB).`);
      return;
    }
    setPendingMedia(file, isImage ? 'image' : 'video');
  });

  function setPendingMedia(file, type) {
    clearPendingMedia();
    pendingMediaFile = file;
    pendingMediaType = type;
    pendingMediaPreviewUrl = URL.createObjectURL(file);
    if (type === 'image') {
      imagePreviewThumb.src = pendingMediaPreviewUrl;
      imagePreviewThumb.style.display = 'block';
      videoPreviewThumb.style.display = 'none';
      imagePreviewNote.textContent = 'Image attached';
    } else {
      videoPreviewThumb.src = pendingMediaPreviewUrl;
      videoPreviewThumb.style.display = 'block';
      imagePreviewThumb.style.display = 'none';
      imagePreviewNote.textContent = 'Video attached';
    }
    imagePreviewRow.classList.add('show');
  }

  function clearPendingMedia() {
    if (pendingMediaPreviewUrl) URL.revokeObjectURL(pendingMediaPreviewUrl);
    pendingMediaFile = null;
    pendingMediaType = null;
    pendingMediaPreviewUrl = null;
    imagePreviewThumb.src = '';
    videoPreviewThumb.src = '';
    imagePreviewRow.classList.remove('show');
  }

  clearImageBtn.addEventListener('click', clearPendingMedia);

  function renderAll(rows) {
    feed.innerHTML = '';
    if (!rows.length) {
      feed.innerHTML = '<div class="empty">No messages yet. Say hello 👋</div>';
      return;
    }
    feed.style.scrollBehavior = 'auto'; // jump straight to bottom on first load, no animation
    for (const m of rows) addRow(m, false);
    feed.scrollTop = feed.scrollHeight;
    requestAnimationFrame(() => { feed.style.scrollBehavior = 'smooth'; });
  }

  function addRow(m, scroll) {
    if (feed.querySelector('.empty')) feed.innerHTML = '';
    const isMe = m.uid === myId;
    const row = document.createElement('div');
    row.className = 'row ' + (isMe ? 'me' : 'other') + (scroll !== false ? ' enter' : '');
    if (m._tempId) row.dataset.tempId = m._tempId;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.backgroundImage = `url("${initialsAvatar(m.username || '?')}")`;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    if (!isMe) {
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = m.username || 'Someone';
      wrap.appendChild(nameEl);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (m.image_url || m.video_url) {
      bubble.classList.add('has-img');
      const isVideo = !!m.video_url;
      const url = m.video_url || m.image_url;

      const mediaWrap = document.createElement('div');
      mediaWrap.className = 'media-wrap';

      let mediaEl;
      if (isVideo) {
        mediaEl = document.createElement('video');
        mediaEl.src = url;
        mediaEl.muted = true;
        mediaEl.playsInline = true;
        mediaEl.preload = 'metadata';
      } else {
        mediaEl = document.createElement('img');
        mediaEl.src = url;
        mediaEl.alt = 'image';
        mediaEl.loading = 'lazy';
      }
      mediaEl.addEventListener('click', () => openLightbox(url, isVideo ? 'video' : 'image'));

      const dlBtn = document.createElement('button');
      dlBtn.type = 'button';
      dlBtn.className = 'dl-btn';
      dlBtn.title = 'Download';
      dlBtn.textContent = '⬇';
      dlBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        downloadMedia(url, isVideo ? 'video' : 'image');
      });

      mediaWrap.appendChild(mediaEl);
      mediaWrap.appendChild(dlBtn);
      bubble.appendChild(mediaWrap);

      if (m.text) {
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = m.text;
        bubble.appendChild(cap);
      }
    } else {
      bubble.textContent = m.text || '';
    }
    wrap.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(wrap);
    feed.appendChild(row);
    if (scroll !== false) feed.scrollTop = feed.scrollHeight;

    if (m.id != null) seenIds.add(m.id);
    if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
  }

  function drawIncoming(m) {
    if (!belongsToCurrentChat(m)) return;
    if (m.id != null && seenIds.has(m.id)) return; // already on screen, via realtime or poll
    if (m.uid === myId) {
      const idx = pendingByText.findIndex(p => p.text === m.text && p.hasImage === !!(m.image_url || m.video_url));
      if (idx !== -1) {
        // Already drawn optimistically when we sent it, this is just the server echo.
        pendingByText.splice(idx, 1);
        if (m.id != null) seenIds.add(m.id);
        if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
        return;
      }
    }
    addRow(m, true);
  }

  // Quiet safety net: if the realtime socket ever drops without us noticing (backgrounded tab,
  // flaky mobile network), this catches anything we missed. Cheap, since it only asks for
  // messages newer than the last one we've already drawn.
  async function pollForMissed() {
    if (!myId) return;
    let q = client.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
    q = applyChatFilter(q);
    q = lastSeenAt ? q.gt('created_at', lastSeenAt) : q.limit(200);
    const { data, error } = await q;
    if (!error && data) data.forEach(drawIncoming);
  }

  function subscribeRealtime() {
    if (channel) client.removeChannel(channel);
    channel = client
      .channel('public:messages:' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        drawIncoming(payload.new);
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          // Reconnect shortly, and immediately poll so nothing sent during the gap is missed.
          setTimeout(() => { if (myId) subscribeRealtime(); }, 2000);
          pollForMissed();
        }
      });
  }

  async function loadAndSubscribe() {
    let q = client
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(200);

    q = applyChatFilter(q);

    const { data, error } = await q;

    if (error) {
      showBanner('Could not load messages: ' + error.message);
      feed.innerHTML = '<div class="empty">Couldn\'t load chat. See message below.</div>';
    } else {
      renderAll(data || []);
    }

    subscribeRealtime();

    if (!pollTimer) {
      pollTimer = setInterval(pollForMissed, 8000); // background safety net, not the main path
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && myId) pollForMissed();
    });
  }

  // Messages we've drawn locally before the server confirms them, keyed by a client-generated id.
  // When the realtime INSERT event for our own message arrives, we match it here instead of
  // drawing it a second time.
  const pendingByText = []; // FIFO of { tempId, text, hasImage }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const text = input.value.trim();
    const mediaFile = pendingMediaFile;
    const mediaType = pendingMediaType;

    if (!text && !mediaFile) return;
    if (!myId) return;

    input.value = '';

    // Keep the preview URL alive for the optimistic message.
    const localPreviewUrl = pendingMediaPreviewUrl;

    pendingMediaFile = null;
    pendingMediaType = null;
    pendingMediaPreviewUrl = null;

    imagePreviewThumb.src = '';
    videoPreviewThumb.src = '';
    imagePreviewRow.classList.remove('show');

    input.focus();

    const tempId = makeClientId();

    pendingByText.push({
      tempId,
      text,
      hasImage: !!mediaFile
    });

    addRow({
      uid: myId,
      username: myName,
      text,
      image_url: mediaType === 'image' ? (localPreviewUrl || null) : null,
      video_url: mediaType === 'video' ? (localPreviewUrl || null) : null,
      _tempId: tempId
    }, true);

    try {
      let image_url = null;
      let video_url = null;

      if (mediaFile) {
        const fallbackExt = mediaType === 'video' ? 'mp4' : 'jpg';
        const ext = (mediaFile.name.split('.').pop() || fallbackExt)
          .toLowerCase()
          .replace(/[^a-z0-9]/g, '') || fallbackExt;

        const path = `${myId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

        const { error: upErr } = await client
          .storage
          .from('chat-images')
          .upload(path, mediaFile, {
            cacheControl: '3600',
            upsert: false
          });

        if (upErr) throw upErr;

        const publicUrl = client
          .storage
          .from('chat-images')
          .getPublicUrl(path)
          .data
          .publicUrl;

        if (mediaType === 'video') {
          video_url = publicUrl;
        } else {
          image_url = publicUrl;
        }
      }

      const { error: insErr } = await client
        .from('messages')
        .insert({
          uid: myId,
          username: myName,
          text: text,
          image_url: image_url,
          video_url: video_url,
          recipient_id: currentChat.type === 'dm' ? currentChat.id : null
        });

      if (insErr) throw insErr;

      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);

    } catch (err) {
      showBanner('Could not send: ' + (err.message || 'unknown error'));

      const idx = pendingByText.findIndex(p => p.tempId === tempId);
      if (idx !== -1) pendingByText.splice(idx, 1);

      const el = feed.querySelector(`[data-temp-id="${tempId}"]`);
      if (el) el.remove();

      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);
    }
  });

  client.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      myId = session.user.id;
      myName = session.user.user_metadata?.display_name || session.user.email.split('@')[0];
      whoEl.textContent = 'you: ' + myName;
      signOutBtn.style.display = 'inline';
      authOverlay.style.display = 'none';
      setTimeout(async () => {
        await ensureProfile();
        await loadContacts();
      }, 0);
      loadAndSubscribe();
    } else {
      myId = null; myName = null;
      whoEl.textContent = '';
      signOutBtn.style.display = 'none';
      authOverlay.style.display = 'flex';
      feed.innerHTML = '<div class="empty">Sign in to see the chat.</div>';
      if (channel) { client.removeChannel(channel); channel = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      seenIds.clear();
      lastSeenAt = null;
    }
  });
})();
</script>
</body>
</html>
