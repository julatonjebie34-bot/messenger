<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1a1a1a; --muted: #767a82;
    --bubble-other: #ffffff; --bubble-me: #4f7cff; --bubble-me-text: #ffffff; --border: #e4e6ea;
    --danger: #e0393e;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#16171a; --panel:#202226; --text:#f0f0f2; --muted:#9a9ea6;
      --bubble-other:#2b2d33; --bubble-me:#4f7cff; --bubble-me-text:#fff; --border:#33353b;
    }
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; }
  header { padding: max(14px, env(safe-area-inset-top,0px)) 16px 14px; background:var(--panel);
    border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#34c759; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { font-size:12px; color:var(--muted); margin-left:auto; display:flex; align-items:center; gap:8px; }
  #signOutBtn { border:none; background:transparent; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  #feed { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px;
    scroll-behavior: smooth; }
  .row { display:flex; gap:8px; max-width:80%; align-items:flex-end; }
  .row.enter { animation: rowIn .22s ease-out; }
  @keyframes rowIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .row.me { align-self:flex-end; flex-direction:row-reverse; }
  .row.other { align-self:flex-start; }
  .avatar { width:26px; height:26px; border-radius:50%; flex-shrink:0; background-size:cover; background-position:center; }
  .bubble-wrap { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .name { font-size:11px; color:var(--muted); padding:0 2px; }
  .row.me .name { text-align:right; }
  .bubble { padding:9px 13px; border-radius:16px; font-size:14.5px; line-height:1.35;
    word-wrap:break-word; white-space:pre-wrap; }
  .bubble.has-img { padding:4px; }
  .bubble.has-img img { display:block; max-width:220px; max-height:280px; width:100%;
    border-radius:12px; object-fit:cover; }
  .bubble.has-img .caption { padding:6px 8px 3px; }
  .row.other .bubble { background:var(--bubble-other); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .row.me .bubble { background:var(--bubble-me); color:var(--bubble-me-text); border-bottom-right-radius:4px; }
  .empty { margin:auto; text-align:center; color:var(--muted); font-size:14px; padding:20px; }
  form#composer { display:flex; gap:8px; padding:10px 12px;
    padding-bottom:max(10px, env(safe-area-inset-bottom,0px));
    background:var(--panel); border-top:1px solid var(--border); flex-shrink:0;
    flex-wrap:wrap; align-items:center; }
  #attachBtn { border:none; background:var(--bg); color:var(--muted); width:36px; height:36px;
    border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; display:flex;
    align-items:center; justify-content:center; }
  #attachBtn:disabled { opacity:.5; cursor:default; }
  #imagePreviewRow { display:none; width:100%; align-items:center; gap:8px; padding:0 0 8px; }
  #imagePreviewRow.show { display:flex; }
  #imagePreviewRow img { width:52px; height:52px; object-fit:cover; border-radius:10px; border:1px solid var(--border); }
  #imagePreviewRow .clear { border:none; background:var(--bg); color:var(--muted); width:22px; height:22px;
    border-radius:50%; cursor:pointer; font-size:12px; line-height:1; }
  #imagePreviewRow .note { font-size:12px; color:var(--muted); }
  #input { flex:1; border:1px solid var(--border); border-radius:20px; padding:10px 15px;
    font-size:14.5px; background:var(--bg); color:var(--text); outline:none; min-width:0; }
  #send { border:none; background:var(--bubble-me); color:#fff; border-radius:20px;
    padding:0 18px; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0; }
  #send:disabled { opacity:.5; cursor:default; }
  #banner { padding:10px 16px; font-size:13px; color:var(--muted); text-align:center; }

  #authOverlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex;
    align-items:center; justify-content:center; z-index:10; padding:20px; }
  #authCard { background:var(--panel); border-radius:14px; padding:22px; width:100%; max-width:340px; }
  #authCard h2 { margin:0 0 4px; font-size:16px; }
  #authCard p.sub { margin:0 0 16px; font-size:13px; color:var(--muted); }
  .tabs { display:flex; gap:4px; background:var(--bg); border-radius:10px; padding:3px; margin-bottom:16px; }
  .tabs button { flex:1; border:none; background:transparent; padding:8px; border-radius:8px;
    font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; }
  .tabs button.active { background:var(--panel); color:var(--text); }
  #authCard input { width:100%; padding:10px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:14px; margin-bottom:10px; }
  #authCard button.primary { width:100%; border:none; background:var(--bubble-me); color:#fff;
    padding:10px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
  #authError { color:var(--danger); font-size:12px; margin:-4px 0 8px; min-height:14px; }
  #authNote { font-size:12px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>

<div id="authOverlay">
  <div id="authCard">
    <div class="tabs">
      <button id="tabSignIn" class="active" type="button">Sign in</button>
      <button id="tabSignUp" type="button">Create account</button>
    </div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Sign in to join the chat.</p>
    <div id="nameField" style="display:none">
      <input id="displayName" placeholder="Display name" maxlength="24" />
    </div>
    <input id="email" type="email" placeholder="Email" autocomplete="username" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    <div id="authError"></div>
    <button id="authSubmit" class="primary" type="button">Sign in</button>
    <div id="authNote"></div>
  </div>
</div>

<header>
  <div class="dot"></div>
  <h1>Group Chat</h1>
  <div class="sub"><span id="who"></span><button id="signOutBtn" style="display:none">Sign out</button></div>
</header>
<div id="feed"><div class="empty">Loading…</div></div>
<div id="banner" style="display:none"></div>
<form id="composer">
  <div id="imagePreviewRow">
    <img id="imagePreviewThumb" alt="" />
    <span class="note">Image attached</span>
    <button type="button" class="clear" id="clearImageBtn">✕</button>
  </div>
  <button id="attachBtn" type="button" title="Attach image">📷</button>
  <input id="fileInput" type="file" accept="image/*" style="display:none" />
  <input id="input" placeholder="Message…" autocomplete="off" maxlength="2000" />
  <button id="send" type="submit">Send</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://wwcmntdvuecbuydhqsqo.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_nFxiub_VpITzHtdiiTaAWw_sa9-qVif";

  const feed = document.getElementById('feed');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const whoEl = document.getElementById('who');
  const signOutBtn = document.getElementById('signOutBtn');
  const banner = document.getElementById('banner');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const imagePreviewRow = document.getElementById('imagePreviewRow');
  const imagePreviewThumb = document.getElementById('imagePreviewThumb');
  const clearImageBtn = document.getElementById('clearImageBtn');

  const authOverlay = document.getElementById('authOverlay');
  const tabSignIn = document.getElementById('tabSignIn');
  const tabSignUp = document.getElementById('tabSignUp');
  const authTitle = document.getElementById('authTitle');
  const authSub = document.getElementById('authSub');
  const nameField = document.getElementById('nameField');
  const displayNameInput = document.getElementById('displayName');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const authError = document.getElementById('authError');
  const authSubmit = document.getElementById('authSubmit');
  const authNote = document.getElementById('authNote');

  function showBanner(text) { banner.style.display = 'block'; banner.textContent = text; }

  function initialsAvatar(name) {
    const letter = (name || '?').trim().charAt(0).toUpperCase() || '?';
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    const hue = Math.abs(hash) % 360;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><rect width="26" height="26" rx="13" fill="hsl(${hue},55%,50%)"/><text x="13" y="18" font-size="12" text-anchor="middle" fill="#fff" font-family="sans-serif">${letter}</text></svg>`
    );
  }

  if (!window.supabase) {
    showBanner('Supabase library failed to load (check your internet connection or ad blocker).');
    feed.innerHTML = '<div class="empty">Chat unavailable.</div>';
    sendBtn.disabled = true;
    return;
  }
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let mode = 'signin'; // or 'signup'
  tabSignIn.addEventListener('click', () => setMode('signin'));
  tabSignUp.addEventListener('click', () => setMode('signup'));

  function setMode(m) {
    mode = m;
    authError.textContent = '';
    authNote.textContent = '';
    if (m === 'signin') {
      tabSignIn.classList.add('active'); tabSignUp.classList.remove('active');
      authTitle.textContent = 'Welcome back';
      authSub.textContent = 'Sign in to join the chat.';
      nameField.style.display = 'none';
      authSubmit.textContent = 'Sign in';
    } else {
      tabSignUp.classList.add('active'); tabSignIn.classList.remove('active');
      authTitle.textContent = 'Create your account';
      authSub.textContent = 'Pick a display name others will see.';
      nameField.style.display = 'block';
      authSubmit.textContent = 'Create account';
    }
  }

  authSubmit.addEventListener('click', async () => {
    authError.textContent = '';
    authNote.textContent = '';
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) { authError.textContent = 'Enter an email and password.'; return; }
    authSubmit.disabled = true;
    try {
      if (mode === 'signup') {
        const name = displayNameInput.value.trim();
        if (!name) { authError.textContent = 'Enter a display name.'; authSubmit.disabled = false; return; }
        const { data, error } = await client.auth.signUp({
          email, password, options: { data: { display_name: name } }
        });
        if (error) throw error;
        if (data.session) {
          // signed in immediately (email confirmation disabled)
        } else {
          authNote.textContent = 'Check your email to confirm your account, then sign in.';
          setMode('signin');
        }
      } else {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      authError.textContent = e.message || 'Something went wrong.';
    } finally {
      authSubmit.disabled = false;
    }
  });

  signOutBtn.addEventListener('click', async () => {
    await client.auth.signOut();
  });

  let myId = null;
  let myName = null;
  let channel = null;
  let pollTimer = null;
  let lastSeenAt = null; // created_at of the newest message we've rendered, drives the fallback poll
  const seenIds = new Set(); // db ids already drawn, so realtime + polling never double-render

  function makeClientId() {
    return 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
  }

  // --- Image attach ---
  const MAX_IMAGE_MB = 8;
  let pendingImageFile = null;
  let pendingImagePreviewUrl = null;

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showBanner('Please choose an image file.');
      return;
    }
    if (file.size > MAX_IMAGE_MB * 1024 * 1024) {
      showBanner(`Image is too large (max ${MAX_IMAGE_MB}MB).`);
      return;
    }
    setPendingImage(file);
  });

  function setPendingImage(file) {
    clearPendingImage();
    pendingImageFile = file;
    pendingImagePreviewUrl = URL.createObjectURL(file);
    imagePreviewThumb.src = pendingImagePreviewUrl;
    imagePreviewRow.classList.add('show');
  }

  function clearPendingImage() {
    if (pendingImagePreviewUrl) URL.revokeObjectURL(pendingImagePreviewUrl);
    pendingImageFile = null;
    pendingImagePreviewUrl = null;
    imagePreviewThumb.src = '';
    imagePreviewRow.classList.remove('show');
  }

  clearImageBtn.addEventListener('click', clearPendingImage);

  function renderAll(rows) {
    feed.innerHTML = '';
    if (!rows.length) {
      feed.innerHTML = '<div class="empty">No messages yet. Say hello 👋</div>';
      return;
    }
    feed.style.scrollBehavior = 'auto'; // jump straight to bottom on first load, no animation
    for (const m of rows) addRow(m, false);
    feed.scrollTop = feed.scrollHeight;
    requestAnimationFrame(() => { feed.style.scrollBehavior = 'smooth'; });
  }

  function addRow(m, scroll) {
    if (feed.querySelector('.empty')) feed.innerHTML = '';
    const isMe = m.uid === myId;
    const row = document.createElement('div');
    row.className = 'row ' + (isMe ? 'me' : 'other') + (scroll !== false ? ' enter' : '');
    if (m._tempId) row.dataset.tempId = m._tempId;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.style.backgroundImage = `url("${initialsAvatar(m.username || '?')}")`;

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';
    if (!isMe) {
      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = m.username || 'Someone';
      wrap.appendChild(nameEl);
    }
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (m.image_url) {
      bubble.classList.add('has-img');
      const img = document.createElement('img');
      img.src = m.image_url;
      img.alt = 'image';
      img.loading = 'lazy';
      bubble.appendChild(img);
      if (m.text) {
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = m.text;
        bubble.appendChild(cap);
      }
    } else {
      bubble.textContent = m.text || '';
    }
    wrap.appendChild(bubble);

    row.appendChild(avatar);
    row.appendChild(wrap);
    feed.appendChild(row);
    if (scroll !== false) feed.scrollTop = feed.scrollHeight;

    if (m.id != null) seenIds.add(m.id);
    if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
  }

  function drawIncoming(m) {
    if (m.id != null && seenIds.has(m.id)) return; // already on screen, via realtime or poll
    if (m.uid === myId) {
      const idx = pendingByText.findIndex(p => p.text === m.text && p.hasImage === !!m.image_url);
      if (idx !== -1) {
        // Already drawn optimistically when we sent it, this is just the server echo.
        pendingByText.splice(idx, 1);
        if (m.id != null) seenIds.add(m.id);
        if (m.created_at && (!lastSeenAt || m.created_at > lastSeenAt)) lastSeenAt = m.created_at;
        return;
      }
    }
    addRow(m, true);
  }

  // Quiet safety net: if the realtime socket ever drops without us noticing (backgrounded tab,
  // flaky mobile network), this catches anything we missed. Cheap, since it only asks for
  // messages newer than the last one we've already drawn.
  async function pollForMissed() {
    if (!myId) return;
    let q = client.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
    q = lastSeenAt ? q.gt('created_at', lastSeenAt) : q.limit(200);
    const { data, error } = await q;
    if (!error && data) data.forEach(drawIncoming);
  }

  function subscribeRealtime() {
    if (channel) client.removeChannel(channel);
    channel = client
      .channel('public:messages:' + Math.random().toString(36).slice(2))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
        drawIncoming(payload.new);
      })
      .subscribe((status) => {
        if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
          // Reconnect shortly, and immediately poll so nothing sent during the gap is missed.
          setTimeout(() => { if (myId) subscribeRealtime(); }, 2000);
          pollForMissed();
        }
      });
  }

  async function loadAndSubscribe() {
    const { data, error } = await client
      .from('messages')
      .select('*')
      .order('created_at', { ascending: true })
      .limit(200);

    if (error) {
      showBanner('Could not load messages: ' + error.message);
      feed.innerHTML = '<div class="empty">Couldn\'t load chat. See message below.</div>';
    } else {
      renderAll(data || []);
    }

    subscribeRealtime();

    if (!pollTimer) {
      pollTimer = setInterval(pollForMissed, 8000); // background safety net, not the main path
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && myId) pollForMissed();
    });
  }

  // Messages we've drawn locally before the server confirms them, keyed by a client-generated id.
  // When the realtime INSERT event for our own message arrives, we match it here instead of
  // drawing it a second time.
  const pendingByText = []; // FIFO of { tempId, text, hasImage }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    const imageFile = pendingImageFile;
    if (!text && !imageFile) return;
    if (!myId) return;

    input.value = '';
    const localPreviewUrl = pendingImagePreviewUrl; // keep the blob URL alive for our own optimistic row
    pendingImageFile = null; // detach from module state so clearPendingImage() below won't revoke it
    pendingImagePreviewUrl = null;
    imagePreviewThumb.src = '';
    imagePreviewRow.classList.remove('show');
    input.focus();

    const tempId = makeClientId();
    pendingByText.push({ tempId, text, hasImage: !!imageFile });
    addRow({ uid: myId, username: myName, text, image_url: localPreviewUrl || null, _tempId: tempId }, true);

    try {
      let image_url = null;
      if (imageFile) {
        const ext = (imageFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        const path = `${myId}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;
        const { error: upErr } = await client.storage.from('chat-images').upload(path, imageFile, {
          cacheControl: '3600', upsert: false
        });
        if (upErr) throw upErr;
        image_url = client.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
      }
      const { error: insErr } = await client.from('messages').insert({
        uid: myId, username: myName, text: text, image_url: image_url
      });
      if (insErr) throw insErr;
      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);
    } catch (err) {
      showBanner('Could not send: ' + (err.message || 'unknown error'));
      const idx = pendingByText.findIndex(p => p.tempId === tempId);
      if (idx !== -1) pendingByText.splice(idx, 1);
      const el = feed.querySelector(`[data-temp-id="${tempId}"]`);
      if (el) el.remove();
      if (localPreviewUrl) URL.revokeObjectURL(localPreviewUrl);
    }
  });

  client.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      myId = session.user.id;
      myName = session.user.user_metadata?.display_name || session.user.email.split('@')[0];
      whoEl.textContent = 'you: ' + myName;
      signOutBtn.style.display = 'inline';
      authOverlay.style.display = 'none';
      loadAndSubscribe();
    } else {
      myId = null; myName = null;
      whoEl.textContent = '';
      signOutBtn.style.display = 'none';
      authOverlay.style.display = 'flex';
      feed.innerHTML = '<div class="empty">Sign in to see the chat.</div>';
      if (channel) { client.removeChannel(channel); channel = null; }
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      seenIds.clear();
      lastSeenAt = null;
    }
  });
})();
</script>
</body>
</html>
